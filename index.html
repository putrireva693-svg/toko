<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>GadgetStore Pro - Login</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;500;600;700;800&family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    overflow: hidden;
    font-family: 'Poppins', sans-serif;

    background:
        radial-gradient(circle at 15% 20%, #8b2be2 0%, transparent 25%),
        radial-gradient(circle at 85% 80%, #5b21b6 0%, transparent 30%),
        linear-gradient(135deg, #090014, #16002d, #25004d, #0b0017);

    position: relative;
}

/* =========================
   BACKGROUND ANIMATION
========================= */

body::before {
    content: "";
    position: absolute;
    width: 700px;
    height: 700px;
    border-radius: 50%;
    background: rgba(168, 85, 247, 0.15);
    filter: blur(80px);
    animation: moveGlow 10s infinite alternate ease-in-out;
}

@keyframes moveGlow {
    0% {
        transform: translate(-250px, -150px);
    }

    100% {
        transform: translate(250px, 150px);
    }
}

/* Stars */

.stars {
    position: absolute;
    inset: 0;
    overflow: hidden;
}

.star {
    position: absolute;
    width: 3px;
    height: 3px;
    background: #fff;
    border-radius: 50%;
    box-shadow: 0 0 10px #d8b4fe;
    animation: twinkle 3s infinite ease-in-out;
}

.star:nth-child(1) { top: 10%; left: 15%; animation-delay: .3s; }
.star:nth-child(2) { top: 20%; left: 80%; animation-delay: 1s; }
.star:nth-child(3) { top: 70%; left: 10%; animation-delay: 1.5s; }
.star:nth-child(4) { top: 85%; left: 75%; animation-delay: .7s; }
.star:nth-child(5) { top: 40%; left: 90%; animation-delay: 2s; }
.star:nth-child(6) { top: 60%; left: 25%; animation-delay: 1.2s; }
.star:nth-child(7) { top: 15%; left: 50%; animation-delay: 2.5s; }
.star:nth-child(8) { top: 90%; left: 45%; animation-delay: .5s; }

@keyframes twinkle {
    0%, 100% {
        opacity: .2;
        transform: scale(.7);
    }

    50% {
        opacity: 1;
        transform: scale(1.5);
    }
}

/* Floating circles */

.circle {
    position: absolute;
    border-radius: 50%;
    border: 1px solid rgba(216, 180, 254, .2);
    animation: rotateCircle 12s linear infinite;
}

.circle.one {
    width: 450px;
    height: 450px;
}

.circle.two {
    width: 650px;
    height: 650px;
    animation-direction: reverse;
    animation-duration: 18s;
}

@keyframes rotateCircle {
    from {
        transform: rotate(0deg);
    }

    to {
        transform: rotate(360deg);
    }
}

/* =========================
   LOGIN CARD
========================= */

.login-card {
    width: 440px;
    padding: 42px;

    position: relative;
    z-index: 10;

    background: rgba(25, 8, 45, .72);
    backdrop-filter: blur(25px);
    -webkit-backdrop-filter: blur(25px);

    border: 1px solid rgba(216, 180, 254, .25);
    border-radius: 28px;

    box-shadow:
        0 30px 80px rgba(0, 0, 0, .65),
        0 0 50px rgba(139, 43, 226, .18);

    color: white;

    animation: cardEnter 1s cubic-bezier(.17,.67,.3,1.3);
}

@keyframes cardEnter {
    from {
        opacity: 0;
        transform: translateY(60px) scale(.9);
    }

    to {
        opacity: 1;
        transform: translateY(0) scale(1);
    }
}

/* =========================
   LOGO
========================= */

.logo {
    width: 78px;
    height: 78px;

    margin: 0 auto 18px;

    display: flex;
    align-items: center;
    justify-content: center;

    border-radius: 22px;

    background: linear-gradient(
        135deg,
        #c084fc,
        #7c3aed,
        #4c1d95
    );

    box-shadow:
        0 0 30px rgba(168, 85, 247, .6),
        inset 0 0 20px rgba(255,255,255,.15);

    font-size: 35px;

    animation: logoFloat 3s infinite ease-in-out;
}

@keyframes logoFloat {
    0%, 100% {
        transform: translateY(0) rotate(0deg);
    }

    50% {
        transform: translateY(-8px) rotate(3deg);
    }
}

/* =========================
   TITLE
========================= */

h1 {
    text-align: center;

    font-family: 'Orbitron', sans-serif;
    font-size: 26px;
    font-weight: 700;
    letter-spacing: 2px;

    background: linear-gradient(
        90deg,
        #ffffff,
        #d8b4fe,
        #a855f7
    );

    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
}

.subtitle {
    text-align: center;
    color: #c4b5fd;
    font-size: 13px;
    margin-top: 8px;
    margin-bottom: 28px;
}

/* =========================
   ROLE BUTTON
========================= */

.role-selector {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 7px;

    padding: 6px;
    margin-bottom: 25px;

    background: rgba(0,0,0,.35);
    border: 1px solid rgba(255,255,255,.08);
    border-radius: 15px;
}

.role-btn {
    padding: 12px;

    border: none;
    border-radius: 11px;

    background: transparent;
    color: #a78bfa;

    font-family: 'Poppins', sans-serif;
    font-weight: 600;

    cursor: pointer;
    transition: .3s;
}

.role-btn:hover {
    color: white;
}

.role-btn.active {
    color: white;

    background: linear-gradient(
        135deg,
        #9333ea,
        #6d28d9
    );

    box-shadow:
        0 6px 20px rgba(124,58,237,.45);
}

/* =========================
   INPUT
========================= */

.form-group {
    margin-bottom: 18px;
}

.form-group label {
    display: block;

    margin-bottom: 8px;

    color: #ddd6fe;
    font-size: 13px;
    font-weight: 500;
}

.input-box {
    position: relative;
}

.input-box span {
    position: absolute;
    left: 14px;
    top: 50%;
    transform: translateY(-50%);

    color: #a855f7;
}

.form-group input {
    width: 100%;
    padding: 13px 15px 13px 43px;

    border-radius: 12px;

    border: 1px solid rgba(216,180,254,.15);

    background: rgba(255,255,255,.06);

    color: white;

    font-family: 'Poppins', sans-serif;
    font-size: 14px;

    outline: none;

    transition: .3s;
}

.form-group input:focus {
    border-color: #a855f7;

    background: rgba(168,85,247,.09);

    box-shadow:
        0 0 0 3px rgba(168,85,247,.12),
        0 0 20px rgba(168,85,247,.15);
}

.form-group input::placeholder {
    color: #7c6f91;
}

/* =========================
   LOGIN BUTTON
========================= */

.btn-login {
    width: 100%;
    padding: 14px;

    margin-top: 8px;

    border: none;
    border-radius: 13px;

    background:
        linear-gradient(
            90deg,
            #7c3aed,
            #a855f7,
            #6d28d9
        );

    background-size: 200% 100%;

    color: white;

    font-family: 'Orbitron', sans-serif;
    font-size: 13px;
    font-weight: 600;
    letter-spacing: 1px;

    cursor: pointer;

    box-shadow:
        0 10px 25px rgba(124,58,237,.35);

    transition: .4s;
}

.btn-login:hover {
    background-position: 100% 0;

    transform: translateY(-3px);

    box-shadow:
        0 15px 35px rgba(168,85,247,.5);
}

.btn-login:active {
    transform: scale(.97);
}

/* =========================
   HINT
========================= */

.hint {
    margin-top: 18px;

    text-align: center;

    color: #8b7da5;
    font-size: 11px;
    line-height: 1.6;
}

/* =========================
   FOOTER
========================= */

.footer {
    margin-top: 22px;

    text-align: center;

    color: #6b5c80;
    font-size: 10px;
    letter-spacing: 1px;
}

/* =========================
   RESPONSIVE
========================= */

@media (max-width: 500px) {

    .login-card {
        width: 90%;
        padding: 30px 24px;
    }

    h1 {
        font-size: 21px;
    }

    .logo {
        width: 65px;
        height: 65px;
        font-size: 28px;
    }
}
</style>
</head>

<body>

<!-- Background -->

<div class="stars">
    <div class="star"></div>
    <div class="star"></div>
    <div class="star"></div>
    <div class="star"></div>
    <div class="star"></div>
    <div class="star"></div>
    <div class="star"></div>
    <div class="star"></div>
</div>

<div class="circle one"></div>
<div class="circle two"></div>

<!-- Login -->

<div class="login-card">

    <div class="logo">
        📱
    </div>

    <h1>GADGETSTORE PRO</h1>

    <p class="subtitle">
        Portal akses toko gadget modern
    </p>

    <div class="role-selector">

        <button
            class="role-btn active"
            id="btnRolePembeli"
            onclick="setRole('pembeli')">

            🛒 Pembeli

        </button>

        <button
            class="role-btn"
            id="btnRoleAdmin"
            onclick="setRole('admin')">

            ⚙️ Admin

        </button>

    </div>

    <form id="loginForm" onsubmit="handleLogin(event)">

        <!-- ADMIN -->

        <div id="adminFields" style="display:none;">

            <div class="form-group">

                <label for="username">
                    Username Administrator
                </label>

                <div class="input-box">

                    <span>👤</span>

                    <input
                        type="text"
                        id="username"
                        placeholder="Masukkan username">

                </div>

            </div>

            <div class="form-group">

                <label for="password">
                    Password
                </label>

                <div class="input-box">

                    <span>🔐</span>

                    <input
                        type="password"
                        id="password"
                        placeholder="Masukkan password">

                </div>

            </div>

        </div>

        <!-- PEMBELI -->

        <div id="pembeliFields">

            <div class="form-group">

                <label for="namaPembeli">
                    Nama Lengkap
                </label>

                <div class="input-box">

                    <span>✨</span>

                    <input
                        type="text"
                        id="namaPembeli"
                        placeholder="Masukkan nama Anda">

                </div>

            </div>

        </div>

        <button
            type="submit"
            class="btn-login"
            id="submitBtn">

            MASUK SEBAGAI PEMBELI

        </button>

    </form>

    <div class="hint" id="loginHint">
        Mode Pembeli: Bebas masuk tanpa password.
    </div>

    <div class="footer">
        GADGETSTORE PRO • DIGITAL SHOPPING SYSTEM
    </div>

</div>

<script>

let currentRole = 'pembeli';

function setRole(role) {

    currentRole = role;

    const btnPembeli =
        document.getElementById('btnRolePembeli');

    const btnAdmin =
        document.getElementById('btnRoleAdmin');

    const adminFields =
        document.getElementById('adminFields');

    const pembeliFields =
        document.getElementById('pembeliFields');

    const submitBtn =
        document.getElementById('submitBtn');

    const loginHint =
        document.getElementById('loginHint');

    if (role === 'admin') {

        btnAdmin.classList.add('active');
        btnPembeli.classList.remove('active');

        adminFields.style.display = 'block';
        pembeliFields.style.display = 'none';

        submitBtn.innerText =
            'MASUK SEBAGAI ADMIN';

        loginHint.innerText =
            'Login Admin: Username "admin" | Password "12345"';

    } else {

        btnPembeli.classList.add('active');
        btnAdmin.classList.remove('active');

        adminFields.style.display = 'none';
        pembeliFields.style.display = 'block';

        submitBtn.innerText =
            'MASUK SEBAGAI PEMBELI';

        loginHint.innerText =
            'Mode Pembeli: Bebas masuk tanpa password.';
    }
}


function handleLogin(event) {

    event.preventDefault();

    if (currentRole === 'admin') {

        const u =
            document.getElementById('username').value;

        const p =
            document.getElementById('password').value;

        if (u === 'admin' && p === '12345') {

            alert('Login Admin Berhasil!');

            window.location.href = 'admin.html';

        } else {

            alert(
                'Username atau password Admin salah!'
            );

        }

    } else {

        const nama =
            document.getElementById('namaPembeli').value
            || 'Pelanggan';

        localStorage.setItem(
            'buyerName',
            nama
        );

        window.location.href =
            'pembeli.html';
    }
}

</script>

</body>
</html>
