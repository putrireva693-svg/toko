<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>GadgetStore Pro - Login</title>

<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;600;700&family=Poppins:wght@400;500;600&display=swap" rel="stylesheet">

<style>

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    min-height: 100vh;

    display: flex;
    justify-content: center;
    align-items: center;

    font-family: 'Poppins', sans-serif;

    background:
        radial-gradient(circle at 10% 20%, #00e5ff55, transparent 25%),
        radial-gradient(circle at 90% 80%, #0066ff55, transparent 30%),
        linear-gradient(
            135deg,
            #020617,
            #071a2d,
            #082f49,
            #020617
        );

    overflow: hidden;
    color: white;
}


/* BACKGROUND */

body::before,
body::after {

    content: "";

    position: absolute;

    width: 450px;
    height: 450px;

    border-radius: 50%;

    border: 1px solid rgba(0,242,254,.15);

    animation: rotate 15s linear infinite;

}

body::before {
    top: -180px;
    left: -150px;
}

body::after {
    bottom: -200px;
    right: -150px;

    animation-direction: reverse;
}

@keyframes rotate {

    from {
        transform: rotate(0deg);
    }

    to {
        transform: rotate(360deg);
    }

}


/* CARD */

.login-card {

    position: relative;
    z-index: 5;

    width: 420px;

    padding: 40px;

    border-radius: 25px;

    background:
        rgba(2,15,30,.72);

    backdrop-filter:
        blur(20px);

    border:
        1px solid
        rgba(0,229,255,.25);

    box-shadow:
        0 25px 70px rgba(0,0,0,.6),
        0 0 40px rgba(0,229,255,.08);

    animation: enter .8s ease;

}

@keyframes enter {

    from {
        opacity: 0;
        transform: translateY(40px);
    }

    to {
        opacity: 1;
        transform: translateY(0);
    }

}


/* LOGO */

.logo {

    width: 70px;
    height: 70px;

    margin: auto;
    margin-bottom: 18px;

    display: flex;
    align-items: center;
    justify-content: center;

    border-radius: 20px;

    font-size: 32px;

    background:
        linear-gradient(
            135deg,
            #00e5ff,
            #0072ff
        );

    box-shadow:
        0 0 30px #00e5ff66;

    animation: float 3s infinite ease-in-out;
}

@keyframes float {

    50% {
        transform: translateY(-8px);
    }

}


/* TITLE */

h1 {

    text-align: center;

    font-family:
        'Orbitron',
        sans-serif;

    font-size: 25px;

    letter-spacing: 2px;

    color: #fff;
}

.subtitle {

    text-align: center;

    margin-top: 8px;
    margin-bottom: 28px;

    color: #94a3b8;

    font-size: 13px;
}


/* ROLE */

.role-selector {

    display: flex;

    padding: 5px;

    margin-bottom: 25px;

    background:
        rgba(0,0,0,.35);

    border-radius: 12px;
}

.role-btn {

    flex: 1;

    padding: 11px;

    border: none;

    background: transparent;

    color: #94a3b8;

    border-radius: 9px;

    cursor: pointer;

    font-weight: 600;

    transition: .3s;
}

.role-btn.active {

    color: white;

    background:
        linear-gradient(
            135deg,
            #00c6ff,
            #0072ff
        );

    box-shadow:
        0 5px 20px #0072ff55;
}


/* FORM */

.form-group {

    margin-bottom: 18px;

    text-align: left;
}

.form-group label {

    display: block;

    margin-bottom: 7px;

    color: #cbd5e1;

    font-size: 13px;
}

.form-group input {

    width: 100%;

    padding: 13px 15px;

    border-radius: 11px;

    border:
        1px solid
        rgba(255,255,255,.15);

    background:
        rgba(255,255,255,.06);

    color: white;

    outline: none;

    transition: .3s;
}

.form-group input:focus {

    border-color:
        #00e5ff;

    box-shadow:
        0 0 15px
        rgba(0,229,255,.15);
}

.form-group input::placeholder {
    color: #64748b;
}


/* BUTTON */

.btn-login {

    width: 100%;

    padding: 14px;

    border: none;

    border-radius: 11px;

    background:
        linear-gradient(
            135deg,
            #00c6ff,
            #0072ff
        );

    color: white;

    font-weight: bold;

    cursor: pointer;

    box-shadow:
        0 8px 25px #0072ff55;

    transition: .3s;
}

.btn-login:hover {

    transform:
        translateY(-3px);

    box-shadow:
        0 12px 30px #0072ff88;
}

.hint {

    margin-top: 16px;

    text-align: center;

    font-size: 11px;

    color: #64748b;
}


@media(max-width:500px) {

    .login-card {

        width: 92%;

        padding: 30px 22px;

    }

    h1 {
        font-size: 20px;
    }

}

</style>
</head>

<body>

<div class="login-card">

    <div class="logo">
        📱
    </div>

    <h1>
        GADGETSTORE PRO
    </h1>

    <p class="subtitle">
        Digital Device Shopping System
    </p>


    <div class="role-selector">

        <button
            class="role-btn active"
            id="btnRolePembeli"
            onclick="setRole('pembeli')">

            🛒 Pembeli

        </button>

        <button
            class="role-btn"
            id="btnRoleAdmin"
            onclick="setRole('admin')">

            ⚙️ Admin

        </button>

    </div>


    <form
        id="loginForm"
        onsubmit="handleLogin(event)">

        <div
            id="adminFields"
            style="display:none;">

            <div class="form-group">

                <label>
                    Username Admin
                </label>

                <input
                    type="text"
                    id="username"
                    placeholder="admin">

            </div>


            <div class="form-group">

                <label>
                    Password
                </label>

                <input
                    type="password"
                    id="password"
                    placeholder="12345">

            </div>

        </div>


        <div id="pembeliFields">

            <div class="form-group">

                <label>
                    Nama Pembeli
                </label>

                <input
                    type="text"
                    id="namaPembeli"
                    placeholder="Masukkan nama Anda">

            </div>

        </div>


        <button
            class="btn-login"
            type="submit"
            id="submitBtn">

            MASUK SEBAGAI PEMBELI

        </button>

    </form>


    <div
        class="hint"
        id="loginHint">

        Pembeli dapat masuk tanpa password.

    </div>

</div>


<script>

let currentRole = "pembeli";


function setRole(role) {

    currentRole = role;

    const pembeli =
        document.getElementById(
            "btnRolePembeli"
        );

    const admin =
        document.getElementById(
            "btnRoleAdmin"
        );

    const pembeliFields =
        document.getElementById(
            "pembeliFields"
        );

    const adminFields =
        document.getElementById(
            "adminFields"
        );

    const button =
        document.getElementById(
            "submitBtn"
        );

    const hint =
        document.getElementById(
            "loginHint"
        );


    if (role === "admin") {

        admin.classList.add("active");
        pembeli.classList.remove("active");

        adminFields.style.display = "block";
        pembeliFields.style.display = "none";

        button.innerText =
            "MASUK SEBAGAI ADMIN";

        hint.innerText =
            'Username: admin | Password: 12345';

    }

    else {

        pembeli.classList.add("active");
        admin.classList.remove("active");

        adminFields.style.display = "none";
        pembeliFields.style.display = "block";

        button.innerText =
            "MASUK SEBAGAI PEMBELI";

        hint.innerText =
            "Pembeli dapat masuk tanpa password.";

    }

}


function handleLogin(event) {

    event.preventDefault();


    if (currentRole === "admin") {

        const username =
            document.getElementById(
                "username"
            ).value;

        const password =
            document.getElementById(
                "password"
            ).value;


        if (
            username === "admin" &&
            password === "12345"
        ) {

            window.location.href =
                "admin.html";

        }

        else {

            alert(
                "Username atau password salah!"
            );

        }

    }

    else {

        const nama =
            document.getElementById(
                "namaPembeli"
            ).value.trim();


        if (!nama) {

            alert(
                "Silakan masukkan nama pembeli!"
            );

            return;

        }


        localStorage.setItem(
            "buyerName",
            nama
        );


        window.location.href =
            "pembeli.html";

    }

}

</script>

</body>
</html>
