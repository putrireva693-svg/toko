<!DOCTYPE html>
<html lang="id">
<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width,
initial-scale=1.0,
maximum-scale=1.0,
user-scalable=no">

<title>GadgetStore Pro - Pembeli</title>

<link rel="preconnect"
href="https://fonts.googleapis.com">

<link rel="preconnect"
href="https://fonts.gstatic.com"
crossorigin>

<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;600;700;800&family=Poppins:wght@300;400;500;600;700&display=swap"
rel="stylesheet">


<style>

/* =================================
   RESET
================================= */

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

html {
    scroll-behavior: smooth;
}

body {

    min-height: 100vh;

    font-family: 'Poppins', sans-serif;

    color: #f5f3ff;

    background:
        radial-gradient(
            circle at 10% 10%,
            #6d28d9 0%,
            transparent 25%
        ),
        radial-gradient(
            circle at 90% 80%,
            #86198f 0%,
            transparent 28%
        ),
        linear-gradient(
            135deg,
            #08000f,
            #160021,
            #260044,
            #0b0017
        );

    background-size: 150% 150%;

    animation:
        backgroundMove 14s ease infinite;

    padding-bottom: 60px;

    overflow-x: hidden;
}


@keyframes backgroundMove {

    0% {
        background-position: 0% 50%;
    }

    50% {
        background-position: 100% 50%;
    }

    100% {
        background-position: 0% 50%;
    }

}


/* =================================
   BACKGROUND GLOW
================================= */

body::before {

    content: "";

    position: fixed;

    width: 400px;
    height: 400px;

    border-radius: 50%;

    background: #a855f7;

    filter: blur(100px);

    opacity: .15;

    top: -180px;
    left: -150px;

    pointer-events: none;

    animation:
        glowMove 9s infinite alternate ease-in-out;

    z-index: 0;
}


body::after {

    content: "";

    position: fixed;

    width: 350px;
    height: 350px;

    border-radius: 50%;

    background: #ec4899;

    filter: blur(100px);

    opacity: .12;

    bottom: -150px;
    right: -100px;

    pointer-events: none;

    animation:
        glowMove2 10s infinite alternate ease-in-out;

    z-index: 0;
}


@keyframes glowMove {

    from {
        transform: translate(0,0);
    }

    to {
        transform: translate(
            220px,
            180px
        );
    }

}


@keyframes glowMove2 {

    from {
        transform: translate(0,0);
    }

    to {
        transform: translate(
            -180px,
            -150px
        );
    }

}


/* =================================
   HEADER
================================= */

header {

    position: sticky;

    top: 10px;

    z-index: 100;

    margin: 10px 12px 0;

    padding: 14px 18px;

    border-radius: 18px;

    display: flex;

    align-items: center;

    justify-content: space-between;

    gap: 10px;

    background:
        rgba(
            25,
            5,
            45,
            .78
        );

    backdrop-filter:
        blur(20px);

    border:
        1px solid
        rgba(
            216,
            180,
            254,
            .16
        );

    box-shadow:
        0 15px 40px
        rgba(0,0,0,.4),

        inset 0 0 25px
        rgba(168,85,247,.04);

    animation:
        headerEnter .7s ease;
}


@keyframes headerEnter {

    from {
        opacity: 0;
        transform:
            translateY(-25px);
    }

    to {
        opacity: 1;
        transform:
            translateY(0);
    }

}


header h1 {

    font-family:
        'Orbitron',
        sans-serif;

    font-size: 17px;

    letter-spacing: 1px;

    color: #f5f3ff;

}


header h1::first-letter {

    color: #c084fc;

}


.header-actions {

    display: flex;

    align-items: center;

    gap: 7px;

    flex-wrap: wrap;

}


.btn-header {

    border: none;

    padding: 8px 12px;

    border-radius: 12px;

    color: white;

    background:
        rgba(
            124,
            58,
            237,
            .2
        );

    border:
        1px solid
        rgba(
            168,
            85,
            247,
            .25
        );

    font-size: 10px;

    font-weight: 600;

    cursor: pointer;

    transition: .3s;

}


.btn-header:hover {

    background:
        linear-gradient(
            135deg,
            #7c3aed,
            #a855f7
        );

    transform:
        translateY(-2px);

    box-shadow:
        0 8px 20px
        rgba(
            168,
            85,
            247,
            .3
        );

}


.cart-badge {

    display: inline-flex;

    align-items: center;

    justify-content: center;

    min-width: 19px;
    height: 19px;

    padding: 2px 5px;

    border-radius: 50%;

    background:
        linear-gradient(
            135deg,
            #ec4899,
            #be185d
        );

    font-size: 9px;

    margin-left: 3px;

}


.btn-exit {

    padding: 7px 10px;

    border-radius: 9px;

    background:
        transparent;

    color: #a78bfa;

    border:
        1px solid
        rgba(
            167,
            139,
            250,
            .3
        );

    cursor: pointer;

    font-size: 9px;

    transition: .3s;

}


.btn-exit:hover {

    color: white;

    border-color:
        #a855f7;

    background:
        rgba(
            168,
            85,
            247,
            .12
        );

}


/* =================================
   CONTAINER
================================= */

.container {

    position: relative;

    z-index: 2;

    max-width: 1200px;

    margin: 25px auto;

    padding: 0 15px;

}


/* =================================
   TOP SECTION
================================= */

.top-section {

    display: flex;

    justify-content:
        space-between;

    align-items: center;

    flex-wrap: wrap;

    gap: 15px;

    margin-bottom: 25px;

}


.welcome-title {

    font-family:
        'Orbitron',
        sans-serif;

    font-size: 18px;

    letter-spacing:
        .5px;

}


.welcome-title span {

    color: #c084fc;

}


/* =================================
   SEARCH
================================= */

.search-box {

    position: relative;

    width: 100%;

    max-width: 380px;

}


.search-box input {

    width: 100%;

    padding:
        12px
        16px
        12px
        42px;

    border-radius: 14px;

    border:
        1px solid
        rgba(
            216,
            180,
            254,
            .18
        );

    outline: none;

    background:
        rgba(
            25,
            5,
            45,
            .65
        );

    backdrop-filter:
        blur(15px);

    color: white;

    font-family:
        'Poppins',
        sans-serif;

    font-size: 11px;

    transition: .3s;

}


.search-box input::placeholder {

    color: #79698c;

}


.search-box input:focus {

    border-color:
        #a855f7;

    box-shadow:
        0 0 0 3px
        rgba(
            168,
            85,
            247,
            .1
        ),

        0 0 20px
        rgba(
            168,
            85,
            247,
            .12
        );

}


.search-icon {

    position: absolute;

    left: 15px;

    top: 50%;

    transform:
        translateY(-50%);

    color:
        #a855f7;

    font-size: 13px;

}


/* =================================
   PRODUCT GRID
================================= */

.product-grid {

    display: grid;

    grid-template-columns:
        repeat(
            auto-fill,
            minmax(
                210px,
                1fr
            )
        );

    gap: 17px;

}


/* =================================
   PRODUCT CARD
================================= */

.product-card {

    position: relative;

    overflow: hidden;

    border-radius: 18px;

    background:
        rgba(
            30,
            10,
            50,
            .72
        );

    backdrop-filter:
        blur(15px);

    border:
        1px solid
        rgba(
            216,
            180,
            254,
            .13
        );

    cursor: pointer;

    display: flex;

    flex-direction: column;

    box-shadow:
        0 15px 35px
        rgba(0,0,0,.28);

    transition:
        .4s
        cubic-bezier(
            .17,
            .67,
            .3,
            1.3
        );

    animation:
        productEnter .6s ease both;

}


.product-card:hover {

    transform:
        translateY(-8px)
        scale(1.015);

    border-color:
        rgba(
            168,
            85,
            247,
            .45
        );

    box-shadow:
        0 25px 50px
        rgba(0,0,0,.4),

        0 0 25px
        rgba(
            168,
            85,
            247,
            .12
        );

}


@keyframes productEnter {

    from {

        opacity: 0;

        transform:
            translateY(25px);

    }

    to {

        opacity: 1;

        transform:
            translateY(0);

    }

}


/* =================================
   PRODUCT IMAGE
================================= */

.product-card img {

    width: 100%;

    height: 170px;

    object-fit: cover;

    transition:
        .5s;

}


.product-card:hover img {

    transform:
        scale(1.06);

}


.product-card::after {

    content:
        "VIEW PRODUCT";

    position: absolute;

    top: 12px;

    right: 12px;

    padding:
        5px 8px;

    border-radius: 8px;

    background:
        rgba(
            109,
            40,
            217,
            .85
        );

    font-family:
        'Orbitron',
        sans-serif;

    font-size: 7px;

    letter-spacing:
        .5px;

    opacity: 0;

    transform:
        translateY(-5px);

    transition: .3s;

}


.product-card:hover::after {

    opacity: 1;

    transform:
        translateY(0);

}


/* =================================
   CARD BODY
================================= */

.product-card .card-body {

    padding: 14px;

    display: flex;

    flex-direction: column;

    flex: 1;

    justify-content:
        space-between;

}


.product-card h3 {

    font-family:
        'Poppins',
        sans-serif;

    font-size: 12px;

    color: #f5f3ff;

    margin-bottom: 6px;

}


.product-card .price {

    font-family:
        'Orbitron',
        sans-serif;

    font-size: 12px;

    font-weight: 700;

    color:
        #c084fc;

}


.product-card .click-hint {

    margin-top: 13px;

    font-size: 8px;

    color:
        #8b7da5;

    text-align:
        right;

}


/* =================================
   MODAL
================================= */

.modal-overlay {

    position: fixed;

    inset: 0;

    width: 100%;

    height: 100%;

    background:
        rgba(
            7,
            0,
            15,
            .82
        );

    backdrop-filter:
        blur(12px);

    display: none;

    justify-content:
        center;

    align-items:
        center;

    z-index: 1000;

    padding: 15px;

}


.modal-content {

    position: relative;

    width: 100%;

    max-width: 850px;

    max-height: 90vh;

    overflow-y: auto;

    padding: 22px;

    display: grid;

    grid-template-columns:
        1fr 1fr;

    gap: 20px;

    border-radius: 22px;

    background:
        rgba(
            30,
            10,
            50,
            .94
        );

    backdrop-filter:
        blur(25px);

    border:
        1px solid
        rgba(
            216,
            180,
            254,
            .2
        );

    box-shadow:
        0 30px 80px
        rgba(0,0,0,.65),

        0 0 40px
        rgba(
            168,
            85,
            247,
            .12
        );

    animation:
        modalEnter .35s ease;

}


@keyframes modalEnter {

    from {

        opacity: 0;

        transform:
            scale(.9)
            translateY(20px);

    }

    to {

        opacity: 1;

        transform:
            scale(1)
            translateY(0);

    }

}


.close-modal {

    position: absolute;

    top: 10px;

    right: 15px;

    width: 30px;
    height: 30px;

    display: flex;

    align-items: center;

    justify-content: center;

    border-radius: 50%;

    color:
        #c4b5fd;

    font-size: 22px;

    cursor: pointer;

    z-index: 10;

    transition: .3s;

}


.close-modal:hover {

    background:
        rgba(
            168,
            85,
            247,
            .2
        );

    color: white;

    transform:
        rotate(90deg);

}


/* =================================
   MODAL PRODUCT
================================= */

.modal-left img {

    width: 100%;

    max-height: 260px;

    object-fit: cover;

    border-radius: 13px;

    margin-bottom: 12px;

    border:
        1px solid
        rgba(
            168,
            85,
            247,
            .18
        );

}


.modal-left p {

    color:
        #c4b5fd;

    font-size: 10px;

    margin-bottom: 6px;

}


.media-container {

    width: 100%;

    border-radius: 12px;

    overflow: hidden;

    background: #000;

    border:
        1px solid
        rgba(
            168,
            85,
            247,
            .18
        );

}


.video-iframe {

    width: 100%;

    height: 220px;

    border: 0;

}


.video-local {

    width: 100%;

    max-height: 220px;

}


.modal-right {

    padding-top: 10px;

}


.modal-right h2 {

    font-family:
        'Orbitron',
        sans-serif;

    font-size: 18px;

    color:
        #f5f3ff;

    margin-bottom: 8px;

}


.modal-right .modal-price {

    font-family:
        'Orbitron',
        sans-serif;

    font-size: 15px;

    font-weight: 700;

    color:
        #c084fc;

    margin-bottom: 14px;

}


.modal-right p {

    color:
        #a78bfa;

    font-size: 11px;

    line-height: 1.7;

    margin-bottom: 20px;

}


/* =================================
   QUANTITY
================================= */

.qty-selector {

    display: flex;

    align-items: center;

    gap: 10px;

    margin-bottom: 16px;

}


.qty-selector label {

    font-size: 11px;

    color:
        #c4b5fd;

}


.qty-selector input {

    width: 60px;

    padding: 8px;

    border-radius: 9px;

    border:
        1px solid
        rgba(
            216,
            180,
            254,
            .2
        );

    background:
        rgba(
            7,
            0,
            15,
            .7
        );

    color: white;

    text-align: center;

    outline: none;

}


/* =================================
   ADD CART
================================= */

.btn-add-cart {

    width: 100%;

    padding: 13px;

    border: none;

    border-radius: 12px;

    color: white;

    background:
        linear-gradient(
            90deg,
            #6d28d9,
            #a855f7,
            #ec4899
        );

    background-size:
        200% 100%;

    font-family:
        'Orbitron',
        sans-serif;

    font-size: 10px;

    font-weight: 700;

    cursor: pointer;

    transition: .4s;

}


.btn-add-cart:hover {

    background-position:
        100% 0;

    transform:
        translateY(-2px);

    box-shadow:
        0 12px 30px
        rgba(
            168,
            85,
            247,
            .35
        );

}


/* =================================
   CART MODAL
================================= */

.cart-modal {

    max-width: 500px;

    grid-template-columns:
        1fr;

}


.cart-modal h2 {

    font-family:
        'Orbitron',
        sans-serif;

    font-size: 16px;

    color:
        #d8b4fe;

}


/* =================================
   CART ITEM
================================= */

.cart-item {

    display: flex;

    justify-content:
        space-between;

    align-items:
        center;

    gap: 10px;

    padding: 12px 0;

    border-bottom:
        1px solid
        rgba(
            216,
            180,
            254,
            .1
        );

    font-size: 10px;

}


.cart-item strong {

    color:
        #f5f3ff;

}


.cart-item small {

    color:
        #8b7da5;

}


.cart-total {

    font-family:
        'Orbitron',
        sans-serif;

    font-size: 13px;

    font-weight: bold;

    text-align: right;

    margin: 15px 0;

    color:
        #c084fc;

}


.cart-actions {

    display: flex;

    gap: 8px;

}


.btn-checkout,
.btn-clear {

    flex: 1;

    padding: 11px;

    border: none;

    border-radius: 10px;

    font-weight: bold;

    cursor: pointer;

    color: white;

    font-size: 9px;

    transition: .3s;

}


.btn-checkout {

    background:
        linear-gradient(
            135deg,
            #059669,
            #10b981
        );

}


.btn-clear {

    background:
        linear-gradient(
            135deg,
            #be123c,
            #ef4444
        );

}


.btn-checkout:hover,
.btn-clear:hover {

    transform:
        translateY(-2px);

}


/* =================================
   STATUS
================================= */

.status-badge {

    padding:
        4px 8px;

    border-radius:
        20px;

    font-size:
        8px;

    font-weight:
        bold;

}


.status-proses {

    background:
        #fef3c7;

    color:
        #92400e;

}


.status-jalan {

    background:
        #dbeafe;

    color:
        #1d4ed8;

}


.status-sampai {

    background:
        #dcfce7;

    color:
        #166534;

}


.status-selesai {

    background:
        #f3e8ff;

    color:
        #7e22ce;

}


/* =================================
   ORDER CARD
================================= */

.order-card-buyer {

    background:
        rgba(
            7,
            0,
            15,
            .55
        );

    border:
        1px solid
        rgba(
            216,
            180,
            254,
            .12
        );

    border-radius:
        13px;

    padding:
        13px;

    margin-bottom:
        10px;

}


.order-card-buyer p {

    color:
        #a78bfa;

    font-size:
        9px;

    margin-bottom:
        5px;

}


/* =================================
   MOBILE
================================= */

@media (max-width: 768px) {

    header {

        margin-left: 8px;
        margin-right: 8px;

        padding: 12px;

    }


    header h1 {

        font-size: 12px;

    }


    .btn-header {

        padding:
            7px 9px;

        font-size:
            8px;

    }


    .btn-exit {

        font-size:
            8px;

        padding:
            6px 8px;

    }


    .container {

        margin-top:
            20px;

        padding:
            0 10px;

    }


    .top-section {

        align-items:
            stretch;

    }


    .welcome-title {

        font-size:
            14px;

    }


    .search-box {

        max-width:
            none;

    }


    .product-grid {

        grid-template-columns:
            repeat(
                2,
                minmax(
                    0,
                    1fr
                )
            );

        gap:
            10px;

    }


    .product-card {

        border-radius:
            14px;

    }


    .product-card img {

        height:
            130px;

    }


    .product-card .card-body {

        padding:
            10px;

    }


    .product-card h3 {

        font-size:
            10px;

    }


    .product-card .price {

        font-size:
            9px;

    }


    .product-card .click-hint {

        font-size:
            7px;

    }


    .modal-content {

        grid-template-columns:
            1fr;

        padding:
            18px;

        max-height:
            92vh;

    }


    .modal-left img {

        max-height:
            180px;

    }


    .video-iframe {

        height:
            180px;

    }

}


@media (max-width: 400px) {

    .product-grid {

        grid-template-columns:
            repeat(
                2,
                1fr
            );

    }


    .product-card img {

        height:
            115px;

    }

}

</style>

</head>


<body>


<!-- =================================
     HEADER
================================= -->

<header>

    <h1>
        🛍️ GADGETSTORE
    </h1>


    <div class="header-actions">

        <button
            class="btn-header"
            onclick="openStatusModal()">

            📦 Lacak

        </button>


        <button
            class="btn-header"
            onclick="openCartModal()">

            🛒 Keranjang

            <span
                class="cart-badge"
                id="cartCount">

                0

            </span>

        </button>


        <button
            class="btn-exit"
            onclick="
                window.location.href='index.html'
            ">

            Keluar

        </button>

    </div>

</header>


<!-- =================================
     MAIN
================================= -->

<div class="container">


    <div class="top-section">

        <h2 class="welcome-title">

            Halo,
            <span id="displayName">
                Pelanggan
            </span>
            ! 👋

        </h2>


        <div class="search-box">

            <span class="search-icon">
                🔍
            </span>

            <input
                type="text"
                id="searchInput"
                placeholder="Cari gadget impianmu..."
                oninput="searchProducts()">

        </div>

    </div>


    <div
        class="product-grid"
        id="buyerProductGrid">

    </div>

</div>


<!-- =================================
     MODAL DETAIL
================================= -->

<div
    class="modal-overlay"
    id="productModal">


    <div class="modal-content">


        <span
            class="close-modal"
            onclick="closeProductModal()">

            &times;

        </span>


        <div class="modal-left">

            <img
                id="modalImg"
                src=""
                alt="Produk">


            <p>
                🎥 VIDEO DEMO PRODUK
            </p>


            <div
                class="media-container"
                id="mediaContainer">

            </div>

        </div>


        <div class="modal-right">

            <h2 id="modalTitle">
                Nama Produk
            </h2>


            <div
                class="modal-price"
                id="modalPrice">

                Rp 0

            </div>


            <p id="modalDesc">

                Deskripsi detail produk.

            </p>


            <div class="qty-selector">

                <label
                    for="buyQty">

                    Jumlah:

                </label>


                <input
                    type="number"
                    id="buyQty"
                    value="1"
                    min="1">

            </div>


            <button
                class="btn-add-cart"
                onclick="addToCart()">

                🛒 MASUKKAN KE KERANJANG

            </button>

        </div>

    </div>

</div>


<!-- =================================
     CART MODAL
================================= -->

<div
    class="modal-overlay"
    id="cartModal">


    <div
        class="modal-content cart-modal">


        <span
            class="close-modal"
            onclick="closeCartModal()">

            &times;

        </span>


        <h2>
            🛒 Keranjang Belanja
        </h2>


        <div
            id="cartItemsList"
            style="margin-top:10px;">

        </div>


        <div
            class="cart-total"
            id="cartTotalText">

            Total: Rp 0

        </div>


        <div class="cart-actions">

            <button
                class="btn-clear"
                onclick="clearCart()">

                Kosongkan

            </button>


            <button
                class="btn-checkout"
                onclick="checkout()">

                Checkout

            </button>

        </div>

    </div>

</div>


<!-- =================================
     STATUS MODAL
================================= -->

<div
    class="modal-overlay"
    id="statusModal">


    <div
        class="modal-content cart-modal">


        <span
            class="close-modal"
            onclick="closeStatusModal()">

            &times;

        </span>


        <h2>
            📦 Status Pesanan
        </h2>


        <div
            id="buyerOrdersList"
            style="margin-top:12px;">

        </div>

    </div>

</div>


<script>

/* =================================
   USER
================================= */

const buyerName =
    localStorage.getItem(
        'buyerName'
    ) || 'Pelanggan';


document.getElementById(
    'displayName'
).innerText =
    buyerName;


/* =================================
   VARIABLES
================================= */

let products = [];

let cart =
    JSON.parse(
        localStorage.getItem(
            'buyerCart'
        )
    ) || [];

let selectedProduct = null;


/* =================================
   FETCH PRODUCTS
================================= */

async function fetchProducts() {

    try {

        const response =
            await fetch(
                'products.json'
            );


        const jsonProducts =
            await response.json();


        const localProducts =
            JSON.parse(
                localStorage.getItem(
                    'gadgetProducts'
                )
            ) || [];


        products = [
            ...jsonProducts,
            ...localProducts
        ];


        renderBuyerProducts();

    }

    catch (error) {

        console.error(
            'Gagal memuat products.json:',
            error
        );


        products =
            JSON.parse(
                localStorage.getItem(
                    'gadgetProducts'
                )
            ) || [];


        renderBuyerProducts();

    }

}


/* =================================
   RENDER PRODUCTS
================================= */

function renderBuyerProducts(
    filteredProducts = null
) {

    const grid =
        document.getElementById(
            'buyerProductGrid'
        );


    grid.innerHTML = '';


    const displayList =
        filteredProducts || products;


    if (
        displayList.length === 0
    ) {

        grid.innerHTML = `

            <p
                style="
                    grid-column:1/-1;
                    text-align:center;
                    color:#a78bfa;
                    padding:50px;
                ">

                🔍 Produk tidak ditemukan

            </p>

        `;

        return;

    }


    displayList.forEach(
        (p, index) => {

            const card =
                document.createElement(
                    'div'
                );


            card.className =
                'product-card';


            card.style.animationDelay =
                `${index * .05}s`;


            card.onclick =
                () =>
                openProductModal(p);


            card.innerHTML = `

                <img
                    src="${p.gambar}"
                    alt="${p.nama}"
                    onerror="
                        this.src=
                        'https://via.placeholder.com/300x200?text=Gambar+Tidak+Tersedia'
                    ">


                <div class="card-body">

                    <div>

                        <h3>
                            ${p.nama}
                        </h3>

                        <div class="price">

                            Rp ${Number(
                                p.harga
                            ).toLocaleString(
                                'id-ID'
                            )}

                        </div>

                    </div>


                    <div class="click-hint">

                        🔍 Klik untuk melihat detail

                    </div>

                </div>

            `;


            grid.appendChild(
                card
            );

        }
    );


    updateCartBadge();

}


/* =================================
   SEARCH
================================= */

function searchProducts() {

    const query =
        document.getElementById(
            'searchInput'
        )
        .value
        .toLowerCase()
        .trim();


    const filtered =
        products.filter(
            p =>

                p.nama
                    .toLowerCase()
                    .includes(query)

                ||

                p.deskripsi
                    .toLowerCase()
                    .includes(query)
        );


    renderBuyerProducts(
        filtered
    );

}


/* =================================
   PRODUCT MODAL
================================= */

function openProductModal(p) {

    selectedProduct = p;


    document.getElementById(
        'modalTitle'
    ).innerText =
        p.nama;


    document.getElementById(
        'modalPrice'
    ).innerText =
        'Rp ' +
        Number(
            p.harga
        ).toLocaleString(
            'id-ID'
        );


    document.getElementById(
        'modalDesc'
    ).innerText =
        p.deskripsi;


    document.getElementById(
        'modalImg'
    ).src =
        p.gambar;


    document.getElementById(
        'buyQty'
    ).value = 1;


    const media =
        document.getElementById(
            'mediaContainer'
        );


    media.innerHTML = '';


    if (p.ytVideo) {

        let embedUrl =
            p.ytVideo;


        if (
            embedUrl.includes(
                'youtu.be/'
            )
        ) {

            const videoId =
                embedUrl
                .split(
                    'youtu.be/'
                )[1]
                .split('?')[0];


            embedUrl =
                `https://www.youtube.com/embed/${videoId}`;

        }

        else if (
            embedUrl.includes(
                'watch?v='
            )
        ) {

            const videoId =
                embedUrl
                .split(
                    'watch?v='
                )[1]
                .split('&')[0];


            embedUrl =
                `https://www.youtube.com/embed/${videoId}`;

        }


        if (
            embedUrl.startsWith(
                'data:video/'
            )
        ) {

            media.innerHTML = `

                <video
                    src="${embedUrl}"
                    class="video-local"
                    controls>
                </video>

            `;

        }

        else {

            media.innerHTML = `

                <iframe
                    src="${embedUrl}"
                    class="video-iframe"
                    allowfullscreen>
                </iframe>

            `;

        }

    }

    else {

        media.innerHTML = `

            <p
                style="
                    color:white;
                    padding:25px;
                    text-align:center;
                    font-size:10px;
                ">

                🎬 Tidak ada video demo.

            </p>

        `;

    }


    document.getElementById(
        'productModal'
    ).style.display =
        'flex';

}


/* =================================
   CLOSE PRODUCT
================================= */

function closeProductModal() {

    document.getElementById(
        'productModal'
    ).style.display =
        'none';


    document.getElementById(
        'mediaContainer'
    ).innerHTML = '';

}


/* =================================
   ADD CART
================================= */

function addToCart() {

    if (!selectedProduct)
        return;


    const qty =
        parseInt(
            document.getElementById(
                'buyQty'
            ).value
        ) || 1;


    const existing =
        cart.find(
            item =>
            item.id ===
            selectedProduct.id
        );


    if (existing) {

        existing.qty += qty;

    }

    else {

        cart.push({

            id:
                selectedProduct.id,

            nama:
                selectedProduct.nama,

            harga:
                selectedProduct.harga,

            qty:
                qty

        });

    }


    localStorage.setItem(
        'buyerCart',
        JSON.stringify(cart)
    );


    updateCartBadge();

    closeProductModal();


    alert(
        `✨ ${qty} ${selectedProduct.nama} berhasil masuk keranjang!`
    );

}


/* =================================
   CART BADGE
================================= */

function updateCartBadge() {

    const totalQty =
        cart.reduce(
            (
                sum,
                item
            ) =>
                sum +
                item.qty,
            0
        );


    document.getElementById(
        'cartCount'
    ).innerText =
        totalQty;

}


/* =================================
   OPEN CART
================================= */

function openCartModal() {

    const cartList =
        document.getElementById(
            'cartItemsList'
        );


    cartList.innerHTML = '';


    let total = 0;


    if (
        cart.length === 0
    ) {

        cartList.innerHTML = `

            <p
                style="
                    color:#8b7da5;
                    text-align:center;
                    padding:25px;
                ">

                🛒 Keranjang masih kosong.

            </p>

        `;

    }

    else {

        cart.forEach(
            item => {

                const subtotal =
                    item.harga *
                    item.qty;


                total +=
                    subtotal;


                const div =
                    document.createElement(
                        'div'
                    );


                div.className =
                    'cart-item';


                div.innerHTML = `

                    <div>

                        <strong>
                            ${item.nama}
                        </strong>

                        <br>

                        <small>

                            ${item.qty} ×
                            Rp ${Number(
                                item.harga
                            ).toLocaleString(
                                'id-ID'
                            )}

                        </small>

                    </div>


                    <strong>

                        Rp ${Number(
                            subtotal
                        ).toLocaleString(
                            'id-ID'
                        )}

                    </strong>

                `;


                cartList.appendChild(
                    div
                );

            }
        );

    }


    document.getElementById(
        'cartTotalText'
    ).innerText =
        'Total: Rp ' +
        Number(
            total
        ).toLocaleString(
            'id-ID'
        );


    document.getElementById(
        'cartModal'
    ).style.display =
        'flex';

}


/* =================================
   CLOSE CART
================================= */

function closeCartModal() {

    document.getElementById(
        'cartModal'
    ).style.display =
        'none';

}


/* =================================
   CLEAR CART
================================= */

function clearCart() {

    if (
        confirm(
            'Kosongkan seluruh keranjang?'
        )
    ) {

        cart = [];


        localStorage.removeItem(
            'buyerCart'
        );


        updateCartBadge();

        openCartModal();

    }

}


/* =================================
   CHECKOUT
================================= */

function checkout() {

    if (
        cart.length === 0
    ) {

        alert(
            '🛒 Keranjang masih kosong!'
        );

        return;

    }


    const orders =
        JSON.parse(
            localStorage.getItem(
                'gadgetOrders'
            )
        ) || [];


    const totalAmount =
        cart.reduce(
            (
                sum,
                item
            ) =>

                sum +
                (
                    item.harga *
                    item.qty
                ),

            0
        );


    const newOrder = {

        id:
            Math.floor(
                100000 +
                Math.random() *
                900000
            ),

        buyerName:
            buyerName,

        date:
            new Date()
                .toLocaleDateString(
                    'id-ID'
                ),

        items:
            [...cart],

        total:
            totalAmount,

        status:
            'Sedang Diproses'

    };


    orders.push(
        newOrder
    );


    localStorage.setItem(
        'gadgetOrders',
        JSON.stringify(
            orders
        )
    );


    alert(
        `🎉 Pesanan #${newOrder.id} berhasil dibuat!`
    );


    cart = [];


    localStorage.removeItem(
        'buyerCart'
    );


    updateCartBadge();

    closeCartModal();

}


/* =================================
   STATUS MODAL
================================= */

function openStatusModal() {

    const container =
        document.getElementById(
            'buyerOrdersList'
        );


    container.innerHTML = '';


    const orders =
        JSON.parse(
            localStorage.getItem(
                'gadgetOrders'
            )
        ) || [];


    const myOrders =
        orders.filter(
            o =>
            o.buyerName ===
            buyerName
        );


    if (
        myOrders.length === 0
    ) {

        container.innerHTML = `

            <p
                style="
                    color:#8b7da5;
                    text-align:center;
                    padding:25px;
                    font-size:10px;
                ">

                📦 Belum ada riwayat pesanan.

            </p>

        `;

    }

    else {

        myOrders.forEach(
            ord => {

                let badgeClass =
                    'status-proses';

                let icon =
                    '⏳';


                if (
                    ord.status ===
                    'Dalam Perjalanan'
                ) {

                    badgeClass =
                        'status-jalan';

                    icon =
                        '🚚';

                }

                else if (
                    ord.status ===
                    'Sudah Sampai'
                ) {

                    badgeClass =
                        'status-sampai';

                    icon =
                        '✅';

                }

                else if (
                    ord.status ===
                    'Selesai'
                ) {

                    badgeClass =
                        'status-selesai';

                    icon =
                        '🎉';

                }


                const itemsText =
                    ord.items
                    .map(
                        i =>
                        `${i.nama} (${i.qty}x)`
                    )
                    .join(
                        ', '
                    );


                const div =
                    document.createElement(
                        'div'
                    );


                div.className =
                    'order-card-buyer';


                div.innerHTML = `

                    <div
                        style="
                            display:flex;
                            justify-content:
                                space-between;
                            align-items:
                                center;
                            gap:8px;
                            margin-bottom:7px;
                        ">

                        <strong>

                            #${ord.id}

                        </strong>


                        <span
                            class="
                                status-badge
                                ${badgeClass}
                            ">

                            ${icon}
                            ${ord.status}

                        </span>

                    </div>


                    <p>
                        📅 Tanggal:
                        ${ord.date}
                    </p>


                    <p>
                        🛍️ Barang:
                        ${itemsText}
                    </p>


                    <p
                        style="
                            color:#c084fc;
                            font-weight:bold;
                        ">

                        💰 Total:
                        Rp ${Number(
                            ord.total
                        ).toLocaleString(
                            'id-ID'
                        )}

                    </p>

                `;


                container.appendChild(
                    div
                );

            }
        );

    }


    document.getElementById(
        'statusModal'
    ).style.display =
        'flex';

}


/* =================================
   CLOSE STATUS
================================= */

function closeStatusModal() {

    document.getElementById(
        'statusModal'
    ).style.display =
        'none';

}


/* =================================
   CLOSE MODAL CLICK OUTSIDE
================================= */

window.addEventListener(
    'click',
    function(event) {

        if (
            event.target ===
            document.getElementById(
                'productModal'
            )
        ) {

            closeProductModal();

        }


        if (
            event.target ===
            document.getElementById(
                'cartModal'
            )
        ) {

            closeCartModal();

        }


        if (
            event.target ===
            document.getElementById(
                'statusModal'
            )
        ) {

            closeStatusModal();

        }

    }
);


/* =================================
   START
================================= */

fetchProducts();

updateCartBadge();

</script>

</body>
</html>
