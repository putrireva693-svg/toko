<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GadgetStore Pro - Pembeli</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:"Segoe UI",Tahoma,sans-serif;
}

body{
    min-height:100vh;
    background:
        radial-gradient(circle at 15% 20%,rgba(0,242,254,.20),transparent 30%),
        radial-gradient(circle at 85% 80%,rgba(99,102,241,.25),transparent 30%),
        linear-gradient(135deg,#07111f,#0f172a,#111827);
    color:#fff;
    padding-bottom:50px;
}

/* BACKGROUND */
.orb{
    position:fixed;
    border-radius:50%;
    filter:blur(80px);
    opacity:.25;
    z-index:-1;
}

.orb1{
    width:300px;
    height:300px;
    background:#00f2fe;
    top:5%;
    left:5%;
}

.orb2{
    width:350px;
    height:350px;
    background:#6366f1;
    right:0;
    bottom:0;
}

/* HEADER */
header{
    position:sticky;
    top:0;
    z-index:100;
    padding:15px 25px;
    display:flex;
    justify-content:space-between;
    align-items:center;
    flex-wrap:wrap;
    gap:12px;

    background:rgba(15,23,42,.85);
    backdrop-filter:blur(18px);
    border-bottom:1px solid rgba(255,255,255,.12);
    box-shadow:0 8px 25px rgba(0,0,0,.3);
}

.logo{
    font-size:1.3rem;
    font-weight:bold;
    background:linear-gradient(90deg,#fff,#00f2fe);
    -webkit-background-clip:text;
    -webkit-text-fill-color:transparent;
}

.header-actions{
    display:flex;
    gap:8px;
    flex-wrap:wrap;
}

.btn-header,
.btn-exit{
    border:none;
    border-radius:10px;
    padding:9px 14px;
    cursor:pointer;
    color:white;
    font-weight:bold;
}

.btn-header{
    background:linear-gradient(135deg,#2563eb,#06b6d4);
}

.btn-exit{
    background:rgba(239,68,68,.85);
}

.cart-badge{
    background:#ef4444;
    padding:2px 7px;
    border-radius:20px;
    margin-left:4px;
}

/* CONTAINER */
.container{
    max-width:1200px;
    margin:30px auto;
    padding:0 18px;
}

.top-section{
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:20px;
    flex-wrap:wrap;
    margin-bottom:25px;
}

.welcome-title{
    font-size:1.6rem;
}

.welcome-title span{
    color:#00f2fe;
}

/* SEARCH */
.search-box{
    position:relative;
    width:100%;
    max-width:400px;
}

.search-box input{
    width:100%;
    padding:13px 18px 13px 45px;
    border-radius:30px;
    border:1px solid rgba(255,255,255,.15);
    outline:none;
    color:white;
    background:rgba(255,255,255,.08);
    backdrop-filter:blur(10px);
}

.search-box input::placeholder{
    color:#94a3b8;
}

.search-icon{
    position:absolute;
    left:17px;
    top:50%;
    transform:translateY(-50%);
}

/* PRODUCTS */
.product-grid{
    display:grid;
    grid-template-columns:repeat(auto-fill,minmax(220px,1fr));
    gap:20px;
}

.product-card{
    background:rgba(255,255,255,.08);
    border:1px solid rgba(255,255,255,.12);
    border-radius:18px;
    overflow:hidden;
    cursor:pointer;
    backdrop-filter:blur(12px);
    transition:.3s;
}

.product-card:hover{
    transform:translateY(-7px);
    box-shadow:0 15px 35px rgba(0,0,0,.35);
    border-color:#00f2fe;
}

.product-card img{
    width:100%;
    height:180px;
    object-fit:cover;
}

.card-body{
    padding:15px;
}

.product-card h3{
    margin-bottom:8px;
}

.price{
    color:#00f2fe;
    font-weight:bold;
    font-size:1.05rem;
}

.click-hint{
    color:#94a3b8;
    font-size:.75rem;
    margin-top:10px;
}

/* MODAL */
.modal-overlay{
    position:fixed;
    inset:0;
    background:rgba(0,0,0,.75);
    backdrop-filter:blur(8px);
    display:none;
    justify-content:center;
    align-items:center;
    padding:15px;
    z-index:1000;
}

.modal-content{
    width:100%;
    max-width:850px;
    max-height:92vh;
    overflow-y:auto;
    position:relative;

    background:#111c30;
    border:1px solid rgba(255,255,255,.15);
    border-radius:20px;
    padding:25px;

    box-shadow:0 20px 60px rgba(0,0,0,.6);

    display:grid;
    grid-template-columns:1fr 1fr;
    gap:20px;
}

.close-modal{
    position:absolute;
    right:18px;
    top:10px;
    font-size:30px;
    cursor:pointer;
    color:#94a3b8;
}

.modal-left img{
    width:100%;
    max-height:250px;
    object-fit:cover;
    border-radius:12px;
}

.modal-right h2{
    font-size:1.5rem;
    margin-bottom:10px;
}

.modal-price{
    color:#00f2fe;
    font-size:1.3rem;
    font-weight:bold;
    margin-bottom:12px;
}

.modal-right p{
    color:#cbd5e1;
    line-height:1.5;
}

.media-container{
    margin-top:8px;
    background:#000;
    border-radius:12px;
    overflow:hidden;
}

.video-iframe,
.video-local{
    width:100%;
    height:220px;
    border:none;
}

.qty-selector{
    margin:20px 0;
    display:flex;
    align-items:center;
    gap:10px;
}

.qty-selector input{
    width:70px;
    padding:9px;
    border-radius:8px;
    border:none;
    text-align:center;
}

.btn-add-cart{
    width:100%;
    padding:13px;
    border:none;
    border-radius:10px;
    background:linear-gradient(135deg,#00c6ff,#0072ff);
    color:white;
    font-weight:bold;
    cursor:pointer;
}

/* CART */
.cart-modal{
    max-width:500px;
    grid-template-columns:1fr;
}

.cart-item{
    padding:12px 0;
    border-bottom:1px solid rgba(255,255,255,.1);
    display:flex;
    justify-content:space-between;
    gap:10px;
}

.cart-item small{
    color:#94a3b8;
}

.cart-total{
    text-align:right;
    font-size:1.2rem;
    font-weight:bold;
    margin:18px 0;
    color:#00f2fe;
}

.cart-actions{
    display:flex;
    gap:10px;
}

.btn-checkout,
.btn-clear{
    flex:1;
    border:none;
    padding:12px;
    border-radius:10px;
    color:white;
    font-weight:bold;
    cursor:pointer;
}

.btn-checkout{
    background:#10b981;
}

.btn-clear{
    background:#ef4444;
}

/* CHECKOUT */
.checkout-modal{
    max-width:550px;
    grid-template-columns:1fr;
}

.checkout-box{
    display:flex;
    flex-direction:column;
    gap:12px;
}

.checkout-box label{
    color:#cbd5e1;
    font-size:.85rem;
}

.checkout-box input,
.checkout-box textarea,
.checkout-box select{
    width:100%;
    padding:12px;
    border-radius:9px;
    border:1px solid rgba(255,255,255,.12);
    background:#0b1425;
    color:white;
    outline:none;
}

.checkout-box textarea{
    resize:vertical;
    min-height:80px;
}

.payment-info{
    background:rgba(0,242,254,.08);
    border:1px solid rgba(0,242,254,.2);
    padding:12px;
    border-radius:10px;
    color:#cbd5e1;
    font-size:.85rem;
}

.btn-confirm{
    width:100%;
    padding:13px;
    border:none;
    border-radius:10px;
    background:linear-gradient(135deg,#00c6ff,#0072ff);
    color:white;
    font-weight:bold;
    cursor:pointer;
}

/* STATUS */
.status-badge{
    padding:5px 9px;
    border-radius:15px;
    font-size:.7rem;
    font-weight:bold;
}

.status-proses{
    background:#fef08a;
    color:#854d0e;
}

.status-jalan{
    background:#bae6fd;
    color:#0369a1;
}

.status-sampai{
    background:#bbf7d0;
    color:#166534;
}

.status-selesai{
    background:#e9d5ff;
    color:#6b21a8;
}

.order-card{
    background:rgba(255,255,255,.06);
    border:1px solid rgba(255,255,255,.1);
    border-radius:12px;
    padding:13px;
    margin-bottom:12px;
}

.order-card p{
    margin-top:5px;
    color:#cbd5e1;
    font-size:.82rem;
}

/* RESPONSIVE */
@media(max-width:700px){
    .modal-content{
        grid-template-columns:1fr;
        padding:20px;
    }

    header{
        padding:12px;
    }

    .welcome-title{
        font-size:1.25rem;
    }

    .product-grid{
        grid-template-columns:repeat(2,1fr);
        gap:12px;
    }

    .product-card img{
        height:140px;
    }
}

@media(max-width:450px){
    .product-grid{
        grid-template-columns:1fr;
    }

    .header-actions{
        width:100%;
    }

    .btn-header,
    .btn-exit{
        flex:1;
    }
}
</style>
</head>

<body>

<div class="orb orb1"></div>
<div class="orb orb2"></div>

<header>
    <div class="logo">🛍️ GadgetStore Pro</div>

    <div class="header-actions">
        <button class="btn-header" onclick="openStatusModal()">
            📦 Pesanan
        </button>

        <button class="btn-header" onclick="openCartModal()">
            🛒 Keranjang
            <span class="cart-badge" id="cartCount">0</span>
        </button>

        <button class="btn-exit" onclick="window.location.href='index.html'">
            Keluar
        </button>
    </div>
</header>

<div class="container">

    <div class="top-section">
        <h2 class="welcome-title">
            Halo, <span id="displayName">Pelanggan</span> 👋
        </h2>

        <div class="search-box">
            <span class="search-icon">🔍</span>
            <input
                type="text"
                id="searchInput"
                placeholder="Cari perangkat..."
                oninput="searchProducts()"
            >
        </div>
    </div>

    <div class="product-grid" id="buyerProductGrid"></div>

</div>


<!-- ================= DETAIL PRODUK ================= -->

<div class="modal-overlay" id="productModal">

    <div class="modal-content">

        <span class="close-modal" onclick="closeProductModal()">×</span>

        <div class="modal-left">

            <img id="modalImg" src="" alt="Produk">

            <br>

            <strong>🎥 Video Demo</strong>

            <div class="media-container" id="mediaContainer"></div>

        </div>

        <div class="modal-right">

            <h2 id="modalTitle">Nama Produk</h2>

            <div class="modal-price" id="modalPrice">
                Rp 0
            </div>

            <p id="modalDesc"></p>

            <div class="qty-selector">
                <label>Jumlah:</label>

                <input
                    type="number"
                    id="buyQty"
                    value="1"
                    min="1"
                >
            </div>

            <button
                class="btn-add-cart"
                onclick="addToCart()"
            >
                🛒 Masukkan ke Keranjang
            </button>

        </div>

    </div>

</div>


<!-- ================= KERANJANG ================= -->

<div class="modal-overlay" id="cartModal">

    <div class="modal-content cart-modal">

        <span class="close-modal" onclick="closeCartModal()">×</span>

        <h2>🛒 Keranjang Belanja</h2>

        <div id="cartItemsList"></div>

        <div class="cart-total" id="cartTotalText">
            Total: Rp 0
        </div>

        <div class="cart-actions">

            <button
                class="btn-clear"
                onclick="clearCart()"
            >
                Kosongkan
            </button>

            <button
                class="btn-checkout"
                onclick="openCheckoutModal()"
            >
                Checkout
            </button>

        </div>

    </div>

</div>


<!-- ================= CHECKOUT ================= -->

<div class="modal-overlay" id="checkoutModal">

    <div class="modal-content checkout-modal">

        <span
            class="close-modal"
            onclick="closeCheckoutModal()"
        >
            ×
        </span>

        <h2>💳 Checkout Pesanan</h2>

        <div class="checkout-box">

            <label>👤 Nama Pembeli</label>

            <input
                type="text"
                id="checkoutBuyer"
                readonly
            >


            <label>📦 Nama Penerima</label>

            <input
                type="text"
                id="receiverName"
                placeholder="Masukkan nama penerima"
                required
            >


            <label>📍 Lokasi / Alamat Pengiriman</label>

            <textarea
                id="receiverLocation"
                placeholder="Contoh: Jl. Merdeka No. 10, Semarang"
                required
            ></textarea>


            <label>💳 Metode Pembayaran</label>

            <select id="paymentMethod" onchange="paymentInformation()">

                <option value="">
                    -- Pilih Pembayaran --
                </option>

                <option value="Transfer Bank">
                    🏦 Transfer Bank
                </option>

                <option value="QRIS">
                    📱 QRIS
                </option>

                <option value="COD">
                    💵 COD (Bayar di Tempat)
                </option>

            </select>


            <div
                class="payment-info"
                id="paymentInfo"
            >
                Pilih metode pembayaran.
            </div>


            <div
                class="cart-total"
                id="checkoutTotal"
            >
                Total: Rp 0
            </div>


            <button
                class="btn-confirm"
                onclick="confirmCheckout()"
            >
                ✅ Konfirmasi Pesanan
            </button>

        </div>

    </div>

</div>


<!-- ================= STATUS PESANAN ================= -->

<div class="modal-overlay" id="statusModal">

    <div class="modal-content cart-modal">

        <span
            class="close-modal"
            onclick="closeStatusModal()"
        >
            ×
        </span>

        <h2>📦 Pesanan Saya</h2>

        <div id="buyerOrdersList"></div>

    </div>

</div>


<script>

/* ================= DATA PEMBELI ================= */

const buyerName =
    localStorage.getItem("buyerName") || "Pelanggan";

document.getElementById("displayName").innerText =
    buyerName;

document.getElementById("checkoutBuyer").value =
    buyerName;


/* ================= DATA ================= */

let products = [];

let cart =
    JSON.parse(localStorage.getItem("buyerCart")) || [];

let selectedProduct = null;


/* ================= LOAD PRODUK ================= */

async function fetchProducts(){

    try{

        const response =
            await fetch("products.json");

        const jsonProducts =
            await response.json();

        const localProducts =
            JSON.parse(
                localStorage.getItem("gadgetProducts")
            ) || [];

        products = [
            ...jsonProducts,
            ...localProducts
        ];

        renderBuyerProducts();

    }catch(error){

        console.log(
            "products.json tidak ditemukan."
        );

        products =
            JSON.parse(
                localStorage.getItem("gadgetProducts")
            ) || [];

        renderBuyerProducts();
    }
}


/* ================= TAMPIL PRODUK ================= */

function renderBuyerProducts(filteredProducts=null){

    const grid =
        document.getElementById(
            "buyerProductGrid"
        );

    grid.innerHTML="";

    const list =
        filteredProducts || products;

    if(list.length===0){

        grid.innerHTML=`
            <p style="
                grid-column:1/-1;
                text-align:center;
                padding:40px;
                color:#94a3b8;
            ">
                Produk tidak ditemukan 🔍
            </p>
        `;

        return;
    }

    list.forEach(p=>{

        const card =
            document.createElement("div");

        card.className =
            "product-card";

        card.onclick=()=>{
            openProductModal(p);
        };

        card.innerHTML=`

            <img
                src="${p.gambar}"
                alt="${p.nama}"
                onerror="
                    this.src='https://via.placeholder.com/500x300?text=Device'
                "
            >

            <div class="card-body">

                <h3>${p.nama}</h3>

                <div class="price">
                    Rp ${Number(p.harga)
                    .toLocaleString("id-ID")}
                </div>

                <div class="click-hint">
                    🔍 Klik untuk melihat detail
                </div>

            </div>
        `;

        grid.appendChild(card);

    });

    updateCartBadge();
}


/* ================= SEARCH ================= */

function searchProducts(){

    const query =
        document.getElementById(
            "searchInput"
        ).value.toLowerCase().trim();

    const filtered =
        products.filter(p=>

            p.nama.toLowerCase()
            .includes(query)

            ||

            p.deskripsi.toLowerCase()
            .includes(query)

        );

    renderBuyerProducts(filtered);
}


/* ================= DETAIL PRODUK ================= */

function openProductModal(p){

    selectedProduct=p;

    document.getElementById(
        "modalTitle"
    ).innerText=p.nama;

    document.getElementById(
        "modalPrice"
    ).innerText=
        "Rp "+Number(p.harga)
        .toLocaleString("id-ID");

    document.getElementById(
        "modalDesc"
    ).innerText=p.deskripsi;

    document.getElementById(
        "modalImg"
    ).src=p.gambar;

    document.getElementById(
        "buyQty"
    ).value=1;


    const media =
        document.getElementById(
            "mediaContainer"
        );

    media.innerHTML="";


    /* VIDEO */

    if(p.ytVideo){

        let videoUrl=p.ytVideo;

        if(
            videoUrl.startsWith(
                "data:video/"
            )
        ){

            media.innerHTML=`

                <video
                    src="${videoUrl}"
                    class="video-local"
                    controls
                    playsinline
                ></video>

            `;

        }else{

            let videoId="";

            if(
                videoUrl.includes("youtu.be/")
            ){

                videoId=
                    videoUrl
                    .split("youtu.be/")[1]
                    .split("?")[0];

            }

            else if(
                videoUrl.includes("watch?v=")
            ){

                videoId=
                    videoUrl
                    .split("watch?v=")[1]
                    .split("&")[0];

            }

            else if(
                videoUrl.includes("/embed/")
            ){

                videoId=
                    videoUrl
                    .split("/embed/")[1]
                    .split("?")[0];

            }

            else if(
                videoUrl.includes("/shorts/")
            ){

                videoId=
                    videoUrl
                    .split("/shorts/")[1]
                    .split("?")[0];

            }


            if(videoId){

                media.innerHTML=`

                    <iframe
                        class="video-iframe"
                        src="https://www.youtube.com/embed/${videoId}"
                        title="Video Produk"
                        allow="
                            accelerometer;
                            autoplay;
                            clipboard-write;
                            encrypted-media;
                            gyroscope;
                            picture-in-picture;
                            web-share
                        "
                        allowfullscreen>
                    </iframe>

                `;

            }else{

                media.innerHTML=`

                    <p style="
                        padding:20px;
                        text-align:center;
                        color:white;
                    ">
                        Video tidak dapat diputar.
                    </p>

                `;
            }
        }

    }else{

        media.innerHTML=`

            <p style="
                padding:20px;
                text-align:center;
                color:#94a3b8;
            ">
                Tidak ada video demo.
            </p>

        `;
    }


    document.getElementById(
        "productModal"
    ).style.display="flex";
}


function closeProductModal(){

    document.getElementById(
        "productModal"
    ).style.display="none";

    document.getElementById(
        "mediaContainer"
    ).innerHTML="";
}


/* ================= CART ================= */

function addToCart(){

    if(!selectedProduct){
        return;
    }

    const qty =
        parseInt(
            document.getElementById(
                "buyQty"
            ).value
        ) || 1;


    const existing =
        cart.find(
            item =>
            item.id===selectedProduct.id
        );


    if(existing){

        existing.qty += qty;

    }else{

        cart.push({

            id:selectedProduct.id,

            nama:selectedProduct.nama,

            harga:selectedProduct.harga,

            qty:qty

        });

    }


    localStorage.setItem(
        "buyerCart",
        JSON.stringify(cart)
    );

    updateCartBadge();

    closeProductModal();

    alert(
        `${qty} ${selectedProduct.nama} berhasil masuk keranjang!`
    );
}


function updateCartBadge(){

    const totalQty =
        cart.reduce(
            (sum,item)=>
            sum+item.qty,
            0
        );

    document.getElementById(
        "cartCount"
    ).innerText=totalQty;
}


/* ================= CART MODAL ================= */

function openCartModal(){

    const list =
        document.getElementById(
            "cartItemsList"
        );

    list.innerHTML="";

    let total=0;


    if(cart.length===0){

        list.innerHTML=`

            <p style="
                text-align:center;
                color:#94a3b8;
                padding:20px;
            ">
                Keranjang masih kosong 🛒
            </p>

        `;

    }else{

        cart.forEach(item=>{

            const subtotal =
                item.harga * item.qty;

            total+=subtotal;


            const div =
                document.createElement("div");

            div.className="cart-item";

            div.innerHTML=`

                <div>
                    <strong>${item.nama}</strong>
                    <br>
                    <small>
                        ${item.qty} ×
                        Rp ${Number(item.harga)
                        .toLocaleString("id-ID")}
                    </small>
                </div>

                <strong>
                    Rp ${Number(subtotal)
                    .toLocaleString("id-ID")}
                </strong>

            `;

            list.appendChild(div);

        });

    }


    document.getElementById(
        "cartTotalText"
    ).innerText=
        "Total: Rp "+
        Number(total)
        .toLocaleString("id-ID");


    document.getElementById(
        "cartModal"
    ).style.display="flex";
}


function closeCartModal(){

    document.getElementById(
        "cartModal"
    ).style.display="none";
}


function clearCart(){

    if(
        confirm(
            "Yakin ingin mengosongkan keranjang?"
        )
    ){

        cart=[];

        localStorage.removeItem(
            "buyerCart"
        );

        updateCartBadge();

        openCartModal();
    }
}


/* ================= CHECKOUT ================= */

function openCheckoutModal(){

    if(cart.length===0){

        alert(
            "Keranjang masih kosong!"
        );

        return;
    }


    const total =
        cart.reduce(
            (sum,item)=>
            sum+(item.harga*item.qty),
            0
        );


    document.getElementById(
        "checkoutBuyer"
    ).value=buyerName;

    document.getElementById(
        "checkoutTotal"
    ).innerText=
        "Total: Rp "+
        Number(total)
        .toLocaleString("id-ID");


    closeCartModal();

    document.getElementById(
        "checkoutModal"
    ).style.display="flex";
}


function closeCheckoutModal(){

    document.getElementById(
        "checkoutModal"
    ).style.display="none";
}


/* ================= PAYMENT ================= */

function paymentInformation(){

    const method =
        document.getElementById(
            "paymentMethod"
        ).value;

    const info =
        document.getElementById(
            "paymentInfo"
        );


    if(method==="Transfer Bank"){

        info.innerHTML=`
            🏦 <strong>Transfer Bank</strong><br>
            Silakan transfer sesuai total pesanan.
            <br>
            Bank GadgetStore: BCA 1234567890
        `;

    }

    else if(method==="QRIS"){

        info.innerHTML=`
            📱 <strong>QRIS</strong><br>
            Setelah checkout, lakukan pembayaran
            menggunakan QRIS yang tersedia.
        `;

    }

    else if(method==="COD"){

        info.innerHTML=`
            💵 <strong>COD</strong><br>
            Pembayaran dilakukan saat barang
            diterima oleh penerima.
        `;

    }

    else{

        info.innerText=
            "Pilih metode pembayaran.";
    }
}


/* ================= CONFIRM CHECKOUT ================= */

function confirmCheckout(){

    const receiver =
        document.getElementById(
            "receiverName"
        ).value.trim();

    const location =
        document.getElementById(
            "receiverLocation"
        ).value.trim();

    const payment =
        document.getElementById(
            "paymentMethod"
        ).value;


    if(!receiver){

        alert(
            "Nama penerima harus diisi!"
        );

        return;
    }


    if(!location){

        alert(
            "Alamat/lokasi harus diisi!"
        );

        return;
    }


    if(!payment){

        alert(
            "Silakan pilih metode pembayaran!"
        );

        return;
    }


    const orders =
        JSON.parse(
            localStorage.getItem(
                "gadgetOrders"
            )
        ) || [];


    const total =
        cart.reduce(
            (sum,item)=>
            sum+(item.harga*item.qty),
            0
        );


    const newOrder={

        id:
            Math.floor(
                100000+
                Math.random()*900000
            ),

        buyerName:buyerName,

        receiverName:receiver,

        location:location,

        paymentMethod:payment,

        date:
            new Date()
            .toLocaleDateString(
                "id-ID"
            ),

        items:[...cart],

        total:total,

        status:"Sedang Diproses"

    };


    orders.push(newOrder);


    localStorage.setItem(
        "gadgetOrders",
        JSON.stringify(orders)
    );


    alert(
        `Pesanan #${newOrder.id} berhasil dibuat!`
    );


    cart=[];

    localStorage.removeItem(
        "buyerCart"
    );


    updateCartBadge();

    document.getElementById(
        "receiverName"
    ).value="";

    document.getElementById(
        "receiverLocation"
    ).value="";

    document.getElementById(
        "paymentMethod"
    ).value="";

    document.getElementById(
        "paymentInfo"
    ).innerText=
        "Pilih metode pembayaran.";


    closeCheckoutModal();
}


/* ================= STATUS PESANAN ================= */

function openStatusModal(){

    const container =
        document.getElementById(
            "buyerOrdersList"
        );

    container.innerHTML="";


    const orders =
        JSON.parse(
            localStorage.getItem(
                "gadgetOrders"
            )
        ) || [];


    const myOrders =
        orders.filter(
            o=>
            o.buyerName===buyerName
        );


    if(myOrders.length===0){

        container.innerHTML=`

            <p style="
                text-align:center;
                color:#94a3b8;
                padding:20px;
            ">
                Belum ada pesanan.
            </p>

        `;

    }else{

        myOrders.forEach(ord=>{

            let badge=
                "status-proses";

            let icon="⏳";


            if(
                ord.status===
                "Dalam Perjalanan"
            ){

                badge="status-jalan";
                icon="🚚";

            }

            else if(
                ord.status===
                "Sudah Sampai"
            ){

                badge="status-sampai";
                icon="✅";

            }

            else if(
                ord.status===
                "Selesai"
            ){

                badge="status-selesai";
                icon="🎉";

            }


            const itemsText =
                ord.items
                .map(
                    i=>
                    `${i.nama} (${i.qty}x)`
                )
                .join(", ");


            const div =
                document.createElement(
                    "div"
                );

            div.className=
                "order-card";


            div.innerHTML=`

                <div style="
                    display:flex;
                    justify-content:space-between;
                    gap:10px;
                    align-items:center;
                ">

                    <strong>
                        Order #${ord.id}
                    </strong>

                    <span class="
                        status-badge
                        ${badge}
                    ">
                        ${icon}
                        ${ord.status}
                    </span>

                </div>

                <p>
                    📅 Tanggal:
                    ${ord.date}
                </p>

                <p>
                    👤 Pembeli:
                    ${ord.buyerName}
                </p>

                <p>
                    📦 Penerima:
                    ${ord.receiverName || "-"}
                </p>

                <p>
                    📍 Lokasi:
                    ${ord.location || "-"}
                </p>

                <p>
                    💳 Pembayaran:
                    ${ord.paymentMethod || "-"}
                </p>

                <p>
                    🛍️ Barang:
                    ${itemsText}
                </p>

                <p style="
                    color:#00f2fe;
                    font-weight:bold;
                ">
                    Total:
                    Rp ${Number(ord.total)
                    .toLocaleString("id-ID")}
                </p>

            `;

            container.appendChild(div);

        });

    }


    document.getElementById(
        "statusModal"
    ).style.display="flex";
}


function closeStatusModal(){

    document.getElementById(
        "statusModal"
    ).style.display="none";
}


/* ================= START ================= */

fetchProducts();

updateCartBadge();

</script>
