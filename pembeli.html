<!DOCTYPE html>
<html lang="id">

<head>

<title>GadgetStore Pro - Pembeli</title>

<link

rel="stylesheet">

<style>

/* =========================
RESET
========================= */

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {

    font-family: 'Poppins', sans-serif;

    color: #e2e8f0;

    min-height: 100vh;

    background:

        radial-gradient(
            circle at 10% 10%,
            #00e5ff22,
            transparent 25%
        ),

        radial-gradient(
            circle at 90% 90%,
            #0066ff22,
            transparent 30%
        ),

        linear-gradient(
            135deg,
            #020617,
            #071a2d,
            #082f49,
            #020617
        );

    padding-bottom: 50px;
}


/* =========================
HEADER
========================= */

header {

    position: sticky;

    top: 0;

    z-index: 100;

    display: flex;

    justify-content:
        space-between;

    align-items: center;

    gap: 15px;

    padding: 14px 5%;

    background:
        rgba(2,15,30,.88);

    backdrop-filter:
        blur(18px);

    border-bottom:
        1px solid
        rgba(0,229,255,.15);

    box-shadow:
        0 5px 25px
        rgba(0,0,0,.3);
}

header h1 {

    font-family:
        'Orbitron',
        sans-serif;

    font-size: 20px;

    color: #00e5ff;
}

.header-actions {

    display: flex;

    gap: 8px;
}

.btn-header,
.btn-exit {

    border: none;

    padding:
        9px 13px;

    border-radius: 9px;

    cursor: pointer;

    color: white;

    font-weight: 600;

    background:
        rgba(0,229,255,.12);

    border:
        1px solid
        rgba(0,229,255,.15);
}

.btn-header:hover {

    background:
        rgba(0,229,255,.25);
}

.btn-exit {

    background:
        rgba(239,68,68,.15);

    border-color:
        rgba(239,68,68,.3);
}

.cart-badge {

    background: #ef4444;

    padding:
        2px 7px;

    border-radius: 20px;

    font-size: 11px;
}


/* =========================
CONTAINER
========================= */

.container {

    width: 90%;

    max-width: 1200px;

    margin:
        30px auto;
}


/* =========================
WELCOME
========================= */

.top-section {

    display: flex;

    justify-content:
        space-between;

    align-items: center;

    gap: 20px;

    margin-bottom: 30px;

    flex-wrap: wrap;
}

.welcome-title {

    font-family:
        'Orbitron',
        sans-serif;

    color: white;
}

.welcome-title span {

    color: #00e5ff;
}


/* SEARCH */

.search-box {

    width: 350px;

    position: relative;
}

.search-box input {

    width: 100%;

    padding:
        12px 15px 12px 42px;

    border-radius: 25px;

    border:
        1px solid
        rgba(0,229,255,.2);

    background:
        rgba(255,255,255,.06);

    color: white;

    outline: none;
}

.search-icon {

    position: absolute;

    left: 15px;

    top: 50%;

    transform:
        translateY(-50%);
}


/* =========================
PRODUCT
========================= */

.product-grid {

    display: grid;

    grid-template-columns:
        repeat(
            auto-fill,
            minmax(220px,1fr)
        );

    gap: 20px;
}

.product-card {

    overflow: hidden;

    border-radius: 18px;

    background:
        rgba(8,30,50,.75);

    border:
        1px solid
        rgba(0,229,255,.13);

    box-shadow:
        0 10px 30px
        rgba(0,0,0,.25);

    cursor: pointer;

    transition: .3s;
}

.product-card:hover {

    transform:
        translateY(-7px);

    border-color:
        #00e5ff88;

    box-shadow:
        0 15px 40px
        #00e5ff18;
}

.product-card img {

    width: 100%;

    height: 180px;

    object-fit: cover;
}

.card-body {

    padding: 16px;
}

.card-body h3 {

    color: white;

    margin-bottom: 8px;
}

.price {

    color: #00e5ff;

    font-size: 17px;

    font-weight: bold;
}

.click-hint {

    color: #64748b;

    font-size: 11px;

    margin-top: 10px;
}


/* =========================
MODAL
========================= */

.modal-overlay {

    position: fixed;

    inset: 0;

    z-index: 1000;

    display: none;

    justify-content: center;

    align-items: center;

    padding: 15px;

    background:
        rgba(0,8,20,.85);

    backdrop-filter:
        blur(8px);
}

.modal-content {

    width: 100%;

    max-width: 850px;

    max-height: 90vh;

    overflow-y: auto;

    position: relative;

    padding: 25px;

    border-radius: 20px;

    background:
        #071a2d;

    border:
        1px solid
        rgba(0,229,255,.2);

    display: grid;

    grid-template-columns:
        1fr 1fr;

    gap: 25px;
}

.close-modal {

    position: absolute;

    right: 18px;

    top: 10px;

    font-size: 28px;

    cursor: pointer;

    color: #94a3b8;
}

.modal-left img {

    width: 100%;

    max-height: 260px;

    object-fit: cover;

    border-radius: 12px;
}

.modal-right h2 {

    font-family:
        'Orbitron',
        sans-serif;

    margin-bottom: 10px;
}

.modal-price {

    color: #00e5ff;

    font-size: 22px;

    font-weight: bold;

    margin-bottom: 15px;
}

.modal-right p {

    color: #94a3b8;

    line-height: 1.6;

    margin-bottom: 20px;
}


/* VIDEO */

.media-container {

    margin-top: 10px;

    width: 100%;

    overflow: hidden;

    border-radius: 12px;

    background: black;
}

.video-iframe {

    width: 100%;

    height: 220px;

    border: none;
}

.video-local {

    width: 100%;

    max-height: 220px;
}


/* QTY */

.qty-selector {

    display: flex;

    align-items: center;

    gap: 10px;

    margin-bottom: 15px;
}

.qty-selector input {

    width: 70px;

    padding: 9px;

    border-radius: 8px;

    border:
        1px solid
        #334155;

    background:
        #020617;

    color: white;

    text-align: center;
}


/* BUTTON */

.btn-add-cart {

    width: 100%;

    padding: 13px;

    border: none;

    border-radius: 10px;

    background:
        linear-gradient(
            135deg,
            #00c6ff,
            #0072ff
        );

    color: white;

    font-weight: bold;

    cursor: pointer;
}


/* =========================
CART
========================= */

.cart-modal {

    max-width: 550px;

    grid-template-columns: 1fr;
}

.cart-item {

    display: flex;

    justify-content:
        space-between;

    align-items: center;

    padding: 12px 0;

    border-bottom:
        1px solid
        #1e3a50;

    gap: 15px;
}

.cart-total {

    text-align: right;

    font-size: 20px;

    color: #00e5ff;

    font-weight: bold;

    margin:
        20px 0;
}

.cart-actions {

    display: flex;

    gap: 10px;
}

.btn-checkout,
.btn-clear {

    flex: 1;

    padding: 12px;

    border: none;

    border-radius: 9px;

    color: white;

    font-weight: bold;

    cursor: pointer;
}

.btn-checkout {

    background:
        #10b981;
}

.btn-clear {

    background:
        #ef4444;
}


/* =========================
CHECKOUT
========================= */


const newOrder = {
    id: Math.floor(100000 + Math.random() * 900000),

    buyerName: buyerName,

    receiverName: document.getElementById('receiverName').value,

    location: document.getElementById('location').value,

    paymentMethod: document.getElementById('paymentMethod').value,

    date: new Date().toLocaleDateString('id-ID'),

    items: [...cart],

    total: totalAmount,

    status: 'Sedang Diproses'
};



.checkout-modal {

    max-width: 650px;

    grid-template-columns: 1fr;
}

.checkout-title {

    font-family:
        'Orbitron',
        sans-serif;

    color: #00e5ff;

    margin-bottom: 20px;
}

.form-group {

    margin-bottom: 16px;
}

.form-group label {

    display: block;

    color: #cbd5e1;

    font-size: 13px;

    margin-bottom: 7px;
}

.form-group input,
.form-group textarea,
.form-group select {

    width: 100%;

    padding: 12px;

    border-radius: 9px;

    border:
        1px solid
        #1e4b65;

    background:
        #020f1c;

    color: white;

    outline: none;
}

.form-group textarea {

    height: 90px;

    resize: vertical;
}

.form-group input:focus,
.form-group textarea:focus,
.form-group select:focus {

    border-color:
        #00e5ff;

    box-shadow:
        0 0 12px
        #00e5ff22;
}


/* PAYMENT */

.payment-grid {

    display: grid;

    grid-template-columns:
        repeat(3,1fr);

    gap: 10px;
}

.payment-option {

    padding: 15px;

    text-align: center;

    border:
        1px solid
        #1e4b65;

    border-radius: 10px;

    cursor: pointer;

    transition: .3s;
}

.payment-option:hover {

    border-color:
        #00e5ff;
}

.payment-option.selected {

    background:
        #00e5ff18;

    border-color:
        #00e5ff;
}

.payment-option input {

    display: none;
}


/* =========================
RESPONSIVE
========================= */

@media(max-width:700px) {

    .modal-content {

        grid-template-columns: 1fr;

    }

    .payment-grid {

        grid-template-columns: 1fr;

    }

    .search-box {

        width: 100%;

    }

    header h1 {

        font-size: 15px;

    }

}

</style>

</head>


<body>


<header>

    <h1>
        📱 GADGETSTORE PRO
    </h1>

    <div class="header-actions">

            class="btn-header"

<div class="container">

<!-- =========================
DETAIL PRODUCT
========================= -->

    <div class="modal-content">

        <span

        </span>


        <div class="modal-left">

            <p
                style="
                margin-top:12px;
                color:#00e5ff;
                ">

                🎥 Video Demo

            </p>

            <div
                class="media-container"
                id="mediaContainer">
            </div>

        </div>

            <h2 id="modalTitle">

CART

<!-- =========================
CHECKOUT

        </button>

<!-- =========================
STATUS
========================= -->

<div
    class="modal-overlay"
    id="statusModal">

    <div
        class="modal-content cart-modal">

        <span
            class="close-modal"
            onclick="closeStatusModal()">

            ×

        </span>

        <h2>
            📦 Status Pesanan
        </h2>

        <div
            id="buyerOrdersList">

        </div>

<script>

const buyerName =
    localStorage.getItem(
        "buyerName"
    ) || "Pelanggan";


document.getElementById(
    "displayName"
).innerText = buyerName;


let products = [];

let cart =
    JSON.parse(
        localStorage.getItem(
            "buyerCart"
        )
    ) || [];

let selectedProduct = null;


/* =========================
LOAD PRODUCTS
========================= */

async function fetchProducts() {

    try {

        const response =
            await fetch(
                "products.json"
            );

        products =
            await response.json();

        renderProducts();

    }

    catch(error) {

        console.error(error);

        products = [];

        renderProducts();

    }

}


/* =========================
RENDER PRODUCTS
========================= */

function renderProducts(
    list = products
) {

    const grid =
        document.getElementById(
            "buyerProductGrid"
        );

    grid.innerHTML = "";


    if (list.length === 0) {

        grid.innerHTML = `
            <p>
                Produk tidak ditemukan.
            </p>
        `;

        return;

    }


    list.forEach(
        function(p) {

            const card =
                document.createElement(
                    "div"
                );

            card.className =
                "product-card";


            card.onclick =
                function() {

                    openProductModal(p);

                };


            card.innerHTML = `

                <img
                    src="${p.gambar}"
                    alt="${p.nama}"
                    onerror="
                    this.src='https://placehold.co/500x350/071a2d/00e5ff?text=GadgetStore'
                    ">

                <div class="card-body">

                    <h3>
                        ${p.nama}
                    </h3>

                    <div class="price">

                        Rp ${Number(
                            p.harga
                        ).toLocaleString(
                            "id-ID"
                        )}

                    </div>

                    <div class="click-hint">

                        🔍 Klik untuk detail & video

                    </div>

                </div>
            `;


            grid.appendChild(card);

        }
    );

}


function searchProducts() {

    const q =
        document.getElementById(
            "searchInput"
        ).value.toLowerCase();


    const filtered =
        products.filter(
            function(p) {

                return (
                    p.nama.toLowerCase()
                    .includes(q)
                    ||
                    p.deskripsi.toLowerCase()
                    .includes(q)
                );

            }
        );


    renderProducts(filtered);

}


/* =========================
DETAIL
========================= */

function openProductModal(p) {

    selectedProduct = p;

    document.getElementById(
        "modalTitle"
    ).innerText =
        p.nama;


    document.getElementById(
        "modalPrice"
    ).innerText =
        "Rp " +
        Number(p.harga)
        .toLocaleString("id-ID");


    document.getElementById(
        "modalDesc"
    ).innerText =
        p.deskripsi;


    document.getElementById(
        "modalImg"
    ).src =
        p.gambar;


    document.getElementById(
        "buyQty"
    ).value = 1;


    const media =
        document.getElementById(
            "mediaContainer"
        );


    media.innerHTML = "";


    if (p.ytVideo) {

        let url =
            p.ytVideo;


        /*
        Pastikan URL YouTube
        menjadi /embed/
        */

        if (
            url.includes(
                "youtu.be/"
            )
        ) {

            const id =
                url.split(
                    "youtu.be/"
                )[1]
                .split("?")[0];

            url =
                "https://www.youtube.com/embed/"
                + id;

        }


        else if (
            url.includes(
                "watch?v="
            )
        ) {

            const id =
                url.split(
                    "watch?v="
                )[1]
                .split("&")[0];

            url =
                "https://www.youtube.com/embed/"
                + id;

        }


        if (
            url.startsWith(
                "data:video/"
            )
        ) {

            media.innerHTML = `

                <video
                    src="${url}"
                    class="video-local"
                    controls>
                </video>

            `;

        }

        else {

            media.innerHTML = `

                <iframe
                    class="video-iframe"
                    src="${url}"
                    title="Video Produk"
                    allow="
                    accelerometer;
                    autoplay;
                    clipboard-write;
                    encrypted-media;
                    gyroscope;
                    picture-in-picture;
                    web-share"
                    allowfullscreen>
                </iframe>

            `;

        }

    }

    else {

        media.innerHTML = `

            <p style="
            padding:20px;
            text-align:center;
            color:#94a3b8;
            ">

            Video belum tersedia.

            </p>

        `;

    }


    document.getElementById(
        "productModal"
    ).style.display =
        "flex";

}


function closeProductModal() {

    document.getElementById(
        "productModal"
    ).style.display =
        "none";

}


/* =========================
CART
========================= */

function addToCart() {

    const qty =
        parseInt(
            document.getElementById(
                "buyQty"
            ).value
        ) || 1;


    const existing =
        cart.find(
            item =>
                item.id ===
                selectedProduct.id
        );


    if (existing) {

        existing.qty += qty;

    }

    else {

        cart.push({

            id:
                selectedProduct.id,

            nama:
                selectedProduct.nama,

            harga:
                Number(
                    selectedProduct.harga
                ),

            qty: qty

        });

    }


    saveCart();

    closeProductModal();


    alert(
        "✅ Produk berhasil masuk keranjang!"
    );

}


function saveCart() {

    localStorage.setItem(
        "buyerCart",
        JSON.stringify(cart)
    );

    updateCartBadge();

}


function updateCartBadge() {

    const total =
        cart.reduce(
            (sum,item) =>
                sum + item.qty,
            0
        );


    document.getElementById(
        "cartCount"
    ).innerText =
        total;

}


function openCartModal() {

    const list =
        document.getElementById(
            "cartItemsList"
        );

    list.innerHTML = "";


    let total = 0;


    if (cart.length === 0) {

        list.innerHTML = `

            <p style="
            text-align:center;
            color:#64748b;
            padding:20px;
            ">

                Keranjang masih kosong.

            </p>

        `;

    }


    cart.forEach(
        function(item,index) {

            const subtotal =
                item.harga *
                item.qty;


            total += subtotal;


            list.innerHTML += `

                <div class="cart-item">

                    <div>

                        <strong>
                            ${item.nama}
                        </strong>

                        <br>

                        <small>

                            ${item.qty} ×
                            Rp ${Number(
                                item.harga
                            ).toLocaleString(
                                "id-ID"
                            )}

                        </small>

                    </div>


                    <strong>

                        Rp ${Number(
                            subtotal
                        ).toLocaleString(
                            "id-ID"
                        )}

                    </strong>

                </div>

            `;

        }
    );


    document.getElementById(
        "cartTotalText"
    ).innerText =
        "Total: Rp " +
        Number(total)
        .toLocaleString("id-ID");


    document.getElementById(
        "cartModal"
    ).style.display =
        "flex";

}


function closeCartModal() {

    document.getElementById(
        "cartModal"
    ).style.display =
        "none";

}


function clearCart() {

    if (
        confirm(
            "Kosongkan keranjang?"
        )
    ) {

        cart = [];

        localStorage.removeItem(
            "buyerCart"
        );

        updateCartBadge();

        openCartModal();

    }

}


/* =========================
CHECKOUT
========================= */

function getTotal() {

    return cart.reduce(
        (sum,item) =>
            sum +
            (
                item.harga *
                item.qty
            ),
        0
    );

}


function openCheckout() {

    if (cart.length === 0) {

        alert(
            "Keranjang masih kosong!"
        );

        return;

    }


    document.getElementById(
        "checkoutPembeli"
    ).value =
        buyerName;


    document.getElementById(
        "checkoutTotal"
    ).innerText =
        "Total: Rp " +
        Number(
            getTotal()
        ).toLocaleString(
            "id-ID"
        );


    closeCartModal();


    document.getElementById(
        "checkoutModal"
    ).style.display =
        "flex";

}


function closeCheckout() {

    document.getElementById(
        "checkoutModal"
    ).style.display =
        "none";

}


/* PAYMENT */

document.addEventListener(
    "change",
    function(e) {

        if (
            e.target.name ===
            "payment"
        ) {

            document
                .querySelectorAll(
                    ".payment-option"
                )
                .forEach(
                    function(el) {

                        el.classList.remove(
                            "selected"
                        );

                    }
                );


            e.target
                .parentElement
                .classList.add(
                    "selected"
                );

        }

    }
);


/* =========================
PROCESS CHECKOUT
========================= */

function processCheckout() {

    const penerima =
        document.getElementById(
            "checkoutPenerima"
        ).value.trim();


    const telepon =
        document.getElementById(
            "checkoutTelepon"
        ).value.trim();


    const alamat =
        document.getElementById(
            "checkoutAlamat"
        ).value.trim();


    const lokasi =
        document.getElementById(
            "checkoutLokasi"
        ).value.trim();


    const payment =
        document.querySelector(
            'input[name="payment"]:checked'
        );


    if (!penerima) {

        alert(
            "Masukkan nama penerima!"
        );

        return;

    }


    if (!telepon) {

        alert(
            "Masukkan nomor HP!"
        );

        return;

    }


    if (!alamat) {

        alert(
            "Masukkan alamat!"
        );

        return;

    }


    if (!lokasi) {

        alert(
            "Masukkan lokasi!"
        );

        return;

    }


    if (!payment) {

        alert(
            "Pilih metode pembayaran!"
        );

        return;

    }


    const orders =
        JSON.parse(
            localStorage.getItem(
                "gadgetOrders"
            )
        ) || [];


    const order = {

        id:
            "GS" +
            Date.now()
            .toString()
            .slice(-7),

        buyerName:
            buyerName,

        penerima:
            penerima,

        telepon:
            telepon,

        alamat:
            alamat,

        lokasi:
            lokasi,

        payment:
            payment.value,

        items:
            [...cart],

        total:
            getTotal(),

        date:
            new Date()
            .toLocaleString(
                "id-ID"
            ),

        status:
            "Sedang Diproses"

    };


    orders.push(order);


    localStorage.setItem(
        "gadgetOrders",
        JSON.stringify(orders)
    );


    alert(
        "✅ Pesanan berhasil dibuat!\n" +
        "Nomor pesanan: " +
        order.id
    );


    cart = [];

    localStorage.removeItem(
        "buyerCart"
    );

    updateCartBadge();

    closeCheckout();

}


/* =========================
STATUS
========================= */

function openStatusModal() {

    const container =
        document.getElementById(
            "buyerOrdersList"
        );


    container.innerHTML = "";


    const orders =
        JSON.parse(
            localStorage.getItem(
                "gadgetOrders"
            )
        ) || [];


    const myOrders =
        orders.filter(
            o =>
                o.buyerName ===
                buyerName
        );


    if (myOrders.length === 0) {

        container.innerHTML = `

            <p style="
            text-align:center;
            color:#64748b;
            padding:20px;
            ">

            Belum ada pesanan.

            </p>

        `;

    }


    myOrders.forEach(
        function(order) {

            container.innerHTML += `

                <div class="cart-item">

                    <div>

                        <strong>
                            #${order.id}
                        </strong>

                        <br>

                        <small>
                            ${order.date}
                        </small>

                        <br>

                        <small>
                            Penerima:
                            ${order.penerima}
                        </small>

                        <br>

                        <small>
                            Pembayaran:
                            ${order.payment}
                        </small>

                    </div>


                    <strong>

                        ${order.status}

                    </strong>

                </div>

            `;

        }
    );


    document.getElementById(
        "statusModal"
    ).style.display =
        "flex";

}


function closeStatusModal() {

    document.getElementById(
        "statusModal"
    ).style.display =
        "none";

}


/* START */

updateCartBadge();

fetchProducts();

</script>

</body>
