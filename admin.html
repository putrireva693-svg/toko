<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>GadgetStore Pro - Admin Panel</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;600;700;800&family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

<style>

:root {
    --purple: #a855f7;
    --purple-dark: #6d28d9;
    --purple-light: #d8b4fe;
    --pink: #ec4899;
    --dark: #0b0017;
    --card: rgba(30, 10, 50, .72);
    --text: #f5f3ff;
    --muted: #a78bfa;
}

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

html,
body {
    width: 100%;
    min-height: 100%;
}

body {
    font-family: 'Poppins', sans-serif;
    color: var(--text);

    background:
        radial-gradient(circle at 10% 10%, #6d28d9 0%, transparent 25%),
        radial-gradient(circle at 90% 80%, #86198f 0%, transparent 28%),
        linear-gradient(135deg, #08000f, #160021, #260044, #0b0017);

    background-size: 150% 150%;
    animation: backgroundMove 12s ease infinite;

    padding: 15px;
    overflow-x: hidden;

    position: relative;
}

@keyframes backgroundMove {
    0% {
        background-position: 0% 50%;
    }

    50% {
        background-position: 100% 50%;
    }

    100% {
        background-position: 0% 50%;
    }
}

/* ===============================
   BACKGROUND ORBS
================================ */

body::before,
body::after {
    content: "";
    position: fixed;

    width: 350px;
    height: 350px;

    border-radius: 50%;

    filter: blur(80px);

    opacity: .22;

    pointer-events: none;

    z-index: 0;
}

body::before {
    background: #a855f7;
    top: -150px;
    left: -100px;

    animation: orbOne 8s infinite alternate ease-in-out;
}

body::after {
    background: #ec4899;
    bottom: -150px;
    right: -100px;

    animation: orbTwo 9s infinite alternate ease-in-out;
}

@keyframes orbOne {
    from {
        transform: translate(0, 0);
    }

    to {
        transform: translate(180px, 150px);
    }
}

@keyframes orbTwo {
    from {
        transform: translate(0, 0);
    }

    to {
        transform: translate(-180px, -150px);
    }
}

/* ===============================
   HEADER
================================ */

header {
    position: relative;
    z-index: 5;

    width: 100%;

    display: flex;
    align-items: center;
    justify-content: space-between;

    padding: 17px 20px;

    margin-bottom: 18px;

    border-radius: 18px;

    background: rgba(30, 10, 50, .7);

    backdrop-filter: blur(20px);

    border: 1px solid rgba(216, 180, 254, .18);

    box-shadow:
        0 15px 40px rgba(0,0,0,.4),
        inset 0 0 20px rgba(168,85,247,.05);

    animation: headerEnter .8s ease;
}

@keyframes headerEnter {
    from {
        opacity: 0;
        transform: translateY(-25px);
    }

    to {
        opacity: 1;
        transform: translateY(0);
    }
}

header h1 {
    font-family: 'Orbitron', sans-serif;

    font-size: 17px;

    letter-spacing: 1px;

    display: flex;
    align-items: center;

    gap: 9px;
}

.admin-badge {
    padding: 4px 9px;

    border-radius: 20px;

    font-family: 'Poppins', sans-serif;

    font-size: 9px;

    background:
        linear-gradient(
            135deg,
            #ec4899,
            #8b5cf6
        );

    box-shadow:
        0 0 15px rgba(236,72,153,.35);
}

.btn-logout {
    border: none;

    padding: 9px 15px;

    border-radius: 10px;

    background:
        linear-gradient(
            135deg,
            #be123c,
            #e11d48
        );

    color: white;

    font-weight: 700;

    cursor: pointer;

    transition: .3s;
}

.btn-logout:hover {
    transform: translateY(-2px);

    box-shadow:
        0 8px 20px rgba(225,29,72,.35);
}

/* ===============================
   CONTAINER
================================ */

.container {
    position: relative;
    z-index: 2;

    width: 100%;

    display: grid;

    grid-template-columns: 1fr 1fr;

    gap: 18px;
}

/* ===============================
   CARD
================================ */

.card {
    background: var(--card);

    backdrop-filter: blur(20px);

    border: 1px solid rgba(216,180,254,.14);

    border-radius: 20px;

    padding: 20px;

    box-shadow:
        0 20px 50px rgba(0,0,0,.35),
        inset 0 0 30px rgba(168,85,247,.025);

    animation: cardAppear .7s ease both;

    transition: .3s;
}

.card:hover {
    border-color: rgba(168,85,247,.3);

    transform: translateY(-2px);

    box-shadow:
        0 25px 60px rgba(0,0,0,.45),
        0 0 25px rgba(168,85,247,.08);
}

.card:nth-child(2) {
    animation-delay: .1s;
}

.card:nth-child(3) {
    animation-delay: .2s;
}

@keyframes cardAppear {
    from {
        opacity: 0;
        transform: translateY(25px);
    }

    to {
        opacity: 1;
        transform: translateY(0);
    }
}

.card h2 {
    font-family: 'Orbitron', sans-serif;

    font-size: 13px;

    color: var(--purple-light);

    padding-bottom: 12px;

    margin-bottom: 15px;

    border-bottom: 1px solid rgba(216,180,254,.12);

    letter-spacing: .5px;
}

/* ===============================
   FORM
================================ */

.form-group {
    margin-bottom: 14px;
}

.form-group label {
    display: block;

    margin-bottom: 7px;

    color: #c4b5fd;

    font-size: 11px;
}

.form-group input,
.form-group textarea,
.form-group select {
    width: 100%;

    padding: 11px 13px;

    border-radius: 11px;

    border: 1px solid rgba(216,180,254,.12);

    background: rgba(7,0,15,.65);

    color: white;

    outline: none;

    font-family: 'Poppins', sans-serif;

    font-size: 12px;

    transition: .3s;
}

.form-group input:focus,
.form-group textarea:focus,
.form-group select:focus {
    border-color: var(--purple);

    box-shadow:
        0 0 0 3px rgba(168,85,247,.1),
        0 0 20px rgba(168,85,247,.1);

    background: rgba(168,85,247,.06);
}

.form-group input::placeholder,
.form-group textarea::placeholder {
    color: #6b5c80;
}

.upload-options {
    display: flex;

    flex-direction: column;

    gap: 8px;
}

input[type="file"] {
    color: #a78bfa;

    cursor: pointer;
}

/* ===============================
   BUTTON
================================ */

.btn-submit {
    width: 100%;

    padding: 13px;

    border: none;

    border-radius: 12px;

    color: white;

    background:
        linear-gradient(
            90deg,
            #6d28d9,
            #a855f7,
            #ec4899,
            #7c3aed
        );

    background-size: 250% 100%;

    font-family: 'Orbitron', sans-serif;

    font-size: 11px;

    font-weight: 700;

    letter-spacing: .5px;

    cursor: pointer;

    transition: .4s;

    box-shadow:
        0 10px 25px rgba(124,58,237,.3);
}

.btn-submit:hover {
    background-position: 100% 0;

    transform: translateY(-2px);

    box-shadow:
        0 15px 30px rgba(168,85,247,.4);
}

.btn-cancel {
    width: 100%;

    padding: 10px;

    background: rgba(100,116,139,.5);

    border: 1px solid rgba(255,255,255,.1);

    border-radius: 10px;

    color: white;

    font-weight: bold;

    cursor: pointer;

    margin-top: 7px;
}

/* ===============================
   STATISTICS
================================ */

.stats-grid {
    display: grid;

    grid-template-columns: 1fr 1fr;

    gap: 12px;

    margin-bottom: 20px;
}

.stat-box {
    position: relative;

    padding: 18px;

    border-radius: 15px;

    text-align: center;

    overflow: hidden;

    background:
        linear-gradient(
            145deg,
            rgba(109,40,217,.18),
            rgba(30,10,50,.8)
        );

    border: 1px solid rgba(168,85,247,.18);

    transition: .3s;
}

.stat-box:hover {
    transform: translateY(-4px);

    border-color: rgba(168,85,247,.45);

    box-shadow:
        0 10px 25px rgba(109,40,217,.2);
}

.stat-box::before {
    content: "";

    position: absolute;

    width: 80px;
    height: 80px;

    border-radius: 50%;

    background: #a855f7;

    filter: blur(40px);

    opacity: .15;

    top: -30px;
    right: -30px;
}

.stat-box h3 {
    position: relative;

    font-family: 'Orbitron', sans-serif;

    font-size: 24px;

    color: #d8b4fe;

    margin-top: 5px;
}

.stat-box p {
    position: relative;

    color: #a78bfa;

    font-size: 10px;
}

/* ===============================
   PRODUCT LIST
================================ */

.product-list-admin {
    display: flex;

    flex-direction: column;

    gap: 9px;

    max-height: 300px;

    overflow-y: auto;

    padding-right: 3px;
}

.product-list-admin::-webkit-scrollbar {
    width: 4px;
}

.product-list-admin::-webkit-scrollbar-thumb {
    background: #7c3aed;

    border-radius: 10px;
}

.product-item-admin {
    display: flex;

    align-items: center;

    gap: 10px;

    padding: 9px;

    border-radius: 12px;

    background: rgba(7,0,15,.55);

    border: 1px solid rgba(216,180,254,.08);

    transition: .3s;
}

.product-item-admin:hover {
    border-color: rgba(168,85,247,.3);

    transform: translateX(3px);
}

.product-item-admin img {
    width: 48px;

    height: 48px;

    object-fit: cover;

    border-radius: 9px;

    border: 1px solid rgba(168,85,247,.25);

    flex-shrink: 0;
}

.product-item-admin .info {
    flex: 1;

    min-width: 0;
}

.product-item-admin .info h4 {
    font-size: 11px;

    white-space: nowrap;

    overflow: hidden;

    text-overflow: ellipsis;
}

.product-item-admin .info p {
    color: #c084fc;

    font-size: 10px;

    font-weight: bold;

    margin-top: 2px;
}

/* ===============================
   ACTION BUTTONS
================================ */

.action-btns {
    display: flex;

    gap: 5px;
}

.btn-edit,
.btn-delete {
    border: none;

    padding: 6px 8px;

    border-radius: 7px;

    color: white;

    cursor: pointer;

    font-size: 9px;

    font-weight: bold;

    transition: .25s;
}

.btn-edit {
    background:
        linear-gradient(135deg,#d97706,#f59e0b);
}

.btn-delete {
    background:
        linear-gradient(135deg,#be123c,#ef4444);
}

.btn-edit:hover,
.btn-delete:hover {
    transform: scale(1.07);
}

/* ===============================
   ORDER TABLE
================================ */

.order-table-wrapper {
    width: 100%;

    overflow-x: auto;

    border-radius: 12px;
}

.order-table {
    width: 100%;

    border-collapse: collapse;

    min-width: 650px;

    background: rgba(7,0,15,.3);
}

.order-table th,
.order-table td {
    padding: 11px 9px;

    text-align: left;

    border-bottom:
        1px solid rgba(216,180,254,.08);

    font-size: 10px;
}

.order-table th {
    color: #d8b4fe;

    background:
        rgba(109,40,217,.15);

    font-family: 'Orbitron', sans-serif;

    font-size: 9px;
}

.order-table td {
    color: #ddd6fe;
}

.order-table tr:hover td {
    background: rgba(168,85,247,.04);
}

.status-select {
    padding: 7px;

    border-radius: 8px;

    background: #160021;

    color: #d8b4fe;

    border: 1px solid #7c3aed;

    outline: none;

    font-size: 9px;

    cursor: pointer;
}

/* ===============================
   MOBILE
================================ */

@media (max-width: 767px) {

    body {
        padding: 10px;
    }

    header {
        padding: 13px;

        border-radius: 15px;
    }

    header h1 {
        font-size: 12px;
    }

    .admin-badge {
        font-size: 7px;
    }

    .btn-logout {
        padding: 7px 10px;

        font-size: 9px;
    }

    .container {
        grid-template-columns: 1fr;

        gap: 13px;
    }

    .card {
        padding: 15px;

        border-radius: 16px;
    }

    .card h2 {
        font-size: 11px;
    }

    .stat-box {
        padding: 14px;
    }

    .stat-box h3 {
        font-size: 20px;
    }

    .product-item-admin img {
        width: 42px;

        height: 42px;
    }
}

</style>
</head>

<body>

<header>

    <h1>
        ⚡ GADGETSTORE
        <span class="admin-badge">ADMIN</span>
    </h1>

    <button
        class="btn-logout"
        onclick="window.location.href='index.html'">

        Keluar

    </button>

</header>


<div class="container">

<!-- =================================
     TAMBAH PRODUK
================================= -->

<div class="card">

    <h2 id="formTitle">
        ➕ Tambah Produk Baru
    </h2>

    <form
        id="productForm"
        onsubmit="handleFormSubmit(event)">

        <input
            type="hidden"
            id="editProductId">

        <div class="form-group">

            <label for="nama">
                Nama Produk
            </label>

            <input
                type="text"
                id="nama"
                placeholder="Contoh: iPad Pro M2"
                required>

        </div>


        <div class="form-group">

            <label for="harga">
                Harga Produk (Rp)
            </label>

            <input
                type="number"
                id="harga"
                placeholder="15000000"
                required>

        </div>


        <div class="form-group">

            <label for="deskripsi">
                Deskripsi Produk
            </label>

            <textarea
                id="deskripsi"
                rows="3"
                placeholder="Spesifikasi dan detail produk"
                required></textarea>

        </div>


        <div class="form-group">

            <label>
                🖼️ Gambar Produk
            </label>

            <div class="upload-options">

                <input
                    type="text"
                    id="gambarUrl"
                    placeholder="Link / URL gambar">

                <input
                    type="file"
                    id="gambarFile"
                    accept="image/*"
                    onchange="convertFileToBase64(
                        'gambarFile',
                        'gambarUrl'
                    )">

            </div>

        </div>


        <div class="form-group">

            <label>
                🎬 Video Demo Produk
            </label>

            <div class="upload-options">

                <input
                    type="text"
                    id="ytVideoUrl"
                    placeholder="Link YouTube / Embed">

                <input
                    type="file"
                    id="ytVideoFile"
                    accept="video/*"
                    onchange="convertFileToBase64(
                        'ytVideoFile',
                        'ytVideoUrl'
                    )">

            </div>

        </div>


        <button
            type="submit"
            class="btn-submit"
            id="btnSubmit">

            SIMPAN PRODUK

        </button>


        <button
            type="button"
            class="btn-cancel"
            id="btnCancel"
            onclick="resetForm()">

            BATAL EDIT

        </button>

    </form>

</div>


<!-- =================================
     ANALYTICS
================================= -->

<div class="card">

    <h2>
        📊 Analytics & Inventaris
    </h2>


    <div class="stats-grid">

        <div class="stat-box">

            <p>Total Produk</p>

            <h3 id="totalProductsCount">
                0
            </h3>

        </div>


        <div class="stat-box">

            <p>Total Pesanan</p>

            <h3
                id="totalOrdersCount"
                style="color:#f472b6;">

                0

            </h3>

        </div>

    </div>


    <h2>
        📦 Produk Aktif
    </h2>


    <div
        class="product-list-admin"
        id="productListAdmin">
    </div>

</div>


<!-- =================================
     PESANAN
================================= -->

<div
    class="card"
    style="grid-column:1 / -1;">

    <h2>
        🚚 Kelola Pengiriman Customer
    </h2>


    <div class="order-table-wrapper">

        <table class="order-table">

            <thead>

                <tr>

                    <th>ID</th>

                    <th>Pembeli</th>

                    <th>Tanggal</th>

                    <th>Barang</th>

                    <th>Total</th>

                    <th>Status</th>

                </tr>

            </thead>

            <tbody
                id="adminOrdersBody">
            </tbody>

        </table>

    </div>

</div>

</div>


<script>

/* ===============================
   FILE TO BASE64
================================ */

function convertFileToBase64(
    fileInputId,
    targetUrlInputId
) {

    const fileInput =
        document.getElementById(fileInputId);

    const targetInput =
        document.getElementById(targetUrlInputId);

    if (
        fileInput.files &&
        fileInput.files[0]
    ) {

        const reader =
            new FileReader();

        reader.onload = function(e) {

            targetInput.value =
                e.target.result;

        };

        reader.readAsDataURL(
            fileInput.files[0]
        );
    }
}


/* ===============================
   YOUTUBE URL
================================ */

function formatYouTubeEmbedUrl(url) {

    if (!url) return '';

    if (url.startsWith('data:video/'))
        return url;

    const regExp =
        /^.*(youtu.be\/|v\/|u\/\w\/|embed\/|watch\?v=|\&v=|shorts\/)([^#\&\?]*).*/;

    const match =
        url.match(regExp);

    if (
        match &&
        match[2].length === 11
    ) {

        return `https://www.youtube.com/embed/${match[2]}`;

    }

    return url;
}


/* ===============================
   DATA
================================ */

let products =
    JSON.parse(
        localStorage.getItem(
            'gadgetProducts'
        )
    ) || [

        {
            id: 1,

            nama:
                "Smartphone Premium X",

            harga:
                12000000,

            deskripsi:
                "Layar AMOLED 120Hz, RAM 12GB, Chipset Octa-Core, Kamera 108MP.",

            gambar:
                "https://images.unsplash.com/photo-1511707171634-5f897ff02aa9?w=500",

            ytVideo:
                "https://www.youtube.com/embed/L_LUpnjgPso"
        },

        {
            id: 2,

            nama:
                "Laptop Ultra Book Pro",

            harga:
                18500000,

            deskripsi:
                "Layar 14 Retina 120Hz, RAM 16GB SSD 512GB, Baterai Tahan 18 Jam.",

            gambar:
                "https://images.unsplash.com/photo-1517336714731-489689fd1ca8?w=500",

            ytVideo:
                "https://www.youtube.com/embed/dQw4w9WgXcQ"
        }

    ];


let orders =
    JSON.parse(
        localStorage.getItem(
            'gadgetOrders'
        )
    ) || [];


/* ===============================
   RENDER PRODUCTS
================================ */

function renderAdminProducts() {

    const container =
        document.getElementById(
            'productListAdmin'
        );

    const countElem =
        document.getElementById(
            'totalProductsCount'
        );

    container.innerHTML = '';

    countElem.innerText =
        products.length;


    products.forEach(
        (p, index) => {

            const item =
                document.createElement('div');

            item.className =
                'product-item-admin';


            item.innerHTML = `

                <img
                    src="${p.gambar}"
                    alt="${p.nama}">

                <div class="info">

                    <h4>
                        ${p.nama}
                    </h4>

                    <p>
                        Rp ${Number(p.harga)
                            .toLocaleString('id-ID')}
                    </p>

                </div>

                <div class="action-btns">

                    <button
                        class="btn-edit"
                        onclick="editProduct(${p.id})">

                        Edit

                    </button>

                    <button
                        class="btn-delete"
                        onclick="deleteProduct(${index})">

                        Hapus

                    </button>

                </div>
            `;

            container.appendChild(item);

        }
    );


    localStorage.setItem(
        'gadgetProducts',
        JSON.stringify(products)
    );
}


/* ===============================
   RENDER ORDERS
================================ */

function renderAdminOrders() {

    const tbody =
        document.getElementById(
            'adminOrdersBody'
        );

    const orderCountElem =
        document.getElementById(
            'totalOrdersCount'
        );

    tbody.innerHTML = '';

    orderCountElem.innerText =
        orders.length;


    if (orders.length === 0) {

        tbody.innerHTML = `

            <tr>

                <td
                    colspan="6"
                    style="
                        text-align:center;
                        color:#8b7da5;
                        padding:25px;
                    ">

                    📭 Belum ada pesanan masuk.

                </td>

            </tr>

        `;

        return;
    }


    orders.forEach(
        (ord, index) => {

            const itemsSummary =
                ord.items
                .map(
                    i =>
                    `${i.nama} (${i.qty}x)`
                )
                .join(', ');


            const tr =
                document.createElement('tr');


            tr.innerHTML = `

                <td>
                    <strong>
                        #${ord.id}
                    </strong>
                </td>

                <td>
                    ${ord.buyerName}
                </td>

                <td>
                    ${ord.date}
                </td>

                <td>
                    ${itemsSummary}
                </td>

                <td
                    style="
                        color:#c084fc;
                        font-weight:bold;
                    ">

                    Rp ${Number(ord.total)
                        .toLocaleString('id-ID')}

                </td>

                <td>

                    <select
                        class="status-select"
                        onchange="
                            updateOrderStatus(
                                ${index},
                                this.value
                            )
                        ">

                        <option
                            value="Sedang Diproses"
                            ${ord.status === 'Sedang Diproses'
                            ? 'selected' : ''}>

                            ⏳ Diproses

                        </option>

                        <option
                            value="Dalam Perjalanan"
                            ${ord.status === 'Dalam Perjalanan'
                            ? 'selected' : ''}>

                            🚚 Perjalanan

                        </option>

                        <option
                            value="Sudah Sampai"
                            ${ord.status === 'Sudah Sampai'
                            ? 'selected' : ''}>

                            ✅ Sampai

                        </option>

                        <option
                            value="Selesai"
                            ${ord.status === 'Selesai'
                            ? 'selected' : ''}>

                            🎉 Selesai

                        </option>

                    </select>

                </td>
            `;


            tbody.appendChild(tr);

        }
    );
}


/* ===============================
   UPDATE STATUS
================================ */

function updateOrderStatus(
    index,
    newStatus
) {

    orders[index].status =
        newStatus;

    localStorage.setItem(
        'gadgetOrders',
        JSON.stringify(orders)
    );

    alert(
        `Status pesanan #${orders[index].id} diperbarui: ${newStatus}`
    );
}


/* ===============================
   ADD / EDIT PRODUCT
================================ */

function handleFormSubmit(event) {

    event.preventDefault();


    const editId =
        document.getElementById(
            'editProductId'
        ).value;


    let videoInput =
        document.getElementById(
            'ytVideoUrl'
        ).value;


    videoInput =
        formatYouTubeEmbedUrl(
            videoInput
        );


    const productData = {

        id:
            editId
            ? Number(editId)
            : Date.now(),

        nama:
            document.getElementById(
                'nama'
            ).value,

        harga:
            Number(
                document.getElementById(
                    'harga'
                ).value
            ),

        deskripsi:
            document.getElementById(
                'deskripsi'
            ).value,

        gambar:
            document.getElementById(
                'gambarUrl'
            ).value
            ||
            'https://via.placeholder.com/300',

        ytVideo:
            videoInput

    };


    if (editId) {

        const index =
            products.findIndex(
                p =>
                p.id === Number(editId)
            );


        if (index !== -1) {

            products[index] =
                productData;

            alert(
                '✨ Produk berhasil diperbarui!'
            );

        }

    } else {

        products.push(
            productData
        );

        alert(
            '🎉 Produk baru berhasil ditambahkan!'
        );
    }


    renderAdminProducts();

    resetForm();
}


/* ===============================
   EDIT PRODUCT
================================ */

function editProduct(id) {

    const prod =
        products.find(
            p => p.id === id
        );

    if (!prod) return;


    document.getElementById(
        'editProductId'
    ).value = prod.id;


    document.getElementById(
        'nama'
    ).value = prod.nama;


    document.getElementById(
        'harga'
    ).value = prod.harga;


    document.getElementById(
        'deskripsi'
    ).value = prod.deskripsi;


    document.getElementById(
        'gambarUrl'
    ).value = prod.gambar;


    document.getElementById(
        'ytVideoUrl'
    ).value = prod.ytVideo;


    document.getElementById(
        'formTitle'
    ).innerText =
        '✏️ Edit Produk';


    document.getElementById(
        'btnSubmit'
    ).innerText =
        'UPDATE PRODUK';


    document.getElementById(
        'btnCancel'
    ).style.display =
        'block';


    window.scrollTo({
        top: 0,
        behavior: 'smooth'
    });
}


/* ===============================
   RESET FORM
================================ */

function resetForm() {

    document.getElementById(
        'productForm'
    ).reset();


    document.getElementById(
        'editProductId'
    ).value = '';


    document.getElementById(
        'gambarFile'
    ).value = '';


    document.getElementById(
        'ytVideoFile'
    ).value = '';


    document.getElementById(
        'formTitle'
    ).innerText =
        '➕ Tambah Produk Baru';


    document.getElementById(
        'btnSubmit'
    ).innerText =
        'SIMPAN PRODUK';


    document.getElementById(
        'btnCancel'
    ).style.display =
        'none';
}


/* ===============================
   DELETE PRODUCT
================================ */

function deleteProduct(index) {

    if (
        confirm(
            '⚠️ Yakin ingin menghapus produk ini?'
        )
    ) {

        products.splice(
            index,
            1
        );

        renderAdminProducts();

    }
}


/* ===============================
   START
================================ */

renderAdminProducts();

renderAdminOrders();

</script>
