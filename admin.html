<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>GadgetStore Pro - Admin</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:'Segoe UI',Tahoma,Geneva,Verdana,sans-serif;
}

body{
    min-height:100vh;
    color:white;
    background:linear-gradient(-45deg,#0f2027,#203a43,#2c5364,#1e3c72);
    background-size:400% 400%;
    animation:bgAnimation 12s ease infinite;
    overflow-x:hidden;
    padding:15px;
}

@keyframes bgAnimation{
    0%{background-position:0% 50%}
    50%{background-position:100% 50%}
    100%{background-position:0% 50%}
}

/* ORB */

.orb{
    position:fixed;
    border-radius:50%;
    filter:blur(70px);
    opacity:.35;
    pointer-events:none;
}

.orb1{
    width:300px;
    height:300px;
    background:#00f2fe;
    top:5%;
    left:5%;
}

.orb2{
    width:300px;
    height:300px;
    background:#0072ff;
    bottom:5%;
    right:5%;
}

/* HEADER */

header{
    max-width:1400px;
    margin:auto;
    padding:18px 22px;

    display:flex;
    justify-content:space-between;
    align-items:center;

    background:rgba(255,255,255,.10);
    backdrop-filter:blur(16px);
    -webkit-backdrop-filter:blur(16px);

    border:1px solid rgba(255,255,255,.20);
    border-radius:18px;

    box-shadow:0 15px 35px rgba(0,0,0,.35);

    position:relative;
    z-index:10;
}

header h1{
    font-size:1.4rem;
    background:linear-gradient(to right,#fff,#00f2fe);
    -webkit-background-clip:text;
    -webkit-text-fill-color:transparent;
}

.admin-badge{
    font-size:.65rem;
    background:linear-gradient(135deg,#00c6ff,#0072ff);
    color:white;
    padding:5px 9px;
    border-radius:20px;
    -webkit-text-fill-color:white;
}

.btn-logout{
    border:1px solid rgba(255,255,255,.3);
    background:rgba(239,68,68,.25);
    color:white;
    padding:8px 15px;
    border-radius:20px;
    cursor:pointer;
    font-weight:bold;
}

.btn-logout:hover{
    background:#ef4444;
}

/* CONTAINER */

.container{
    max-width:1400px;
    margin:20px auto;
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:20px;
    position:relative;
    z-index:5;
}

/* CARD */

.card{
    background:rgba(255,255,255,.10);
    backdrop-filter:blur(16px);
    -webkit-backdrop-filter:blur(16px);

    border:1px solid rgba(255,255,255,.18);
    border-radius:18px;

    padding:22px;

    box-shadow:0 15px 35px rgba(0,0,0,.35);
}

.card-full{
    grid-column:1/-1;
}

.card h2{
    color:#00f2fe;
    font-size:1.15rem;
    margin-bottom:18px;
    padding-bottom:10px;
    border-bottom:1px solid rgba(255,255,255,.15);
}

/* FORM */

.form-group{
    margin-bottom:15px;
}

.form-group label{
    display:block;
    margin-bottom:7px;
    color:#dbeafe;
    font-size:.85rem;
}

.form-group input,
.form-group textarea,
.form-group select{
    width:100%;
    padding:12px 14px;

    border-radius:10px;
    border:1px solid rgba(255,255,255,.2);

    background:rgba(0,0,0,.25);
    color:white;

    outline:none;
    font-size:.9rem;
}

.form-group textarea{
    resize:vertical;
}

.form-group input:focus,
.form-group textarea:focus,
.form-group select:focus{
    border-color:#00f2fe;
    box-shadow:0 0 12px rgba(0,242,254,.25);
}

.form-group input::placeholder,
.form-group textarea::placeholder{
    color:#94a3b8;
}

.upload-box{
    display:flex;
    flex-direction:column;
    gap:8px;
}

input[type=file]{
    padding:8px;
    color:#cbd5e1;
}

/* BUTTON */

.btn-submit{
    width:100%;
    padding:13px;

    border:none;
    border-radius:10px;

    background:linear-gradient(135deg,#00c6ff,#0072ff);

    color:white;
    font-weight:bold;
    font-size:.95rem;

    cursor:pointer;

    box-shadow:0 5px 15px rgba(0,114,255,.35);
}

.btn-submit:hover{
    transform:translateY(-2px);
}

.btn-cancel{
    width:100%;
    padding:11px;

    margin-top:8px;

    border:none;
    border-radius:10px;

    background:#64748b;
    color:white;

    cursor:pointer;
    display:none;
}

/* STATS */

.stats-grid{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:12px;
    margin-bottom:20px;
}

.stat-box{
    padding:15px;
    text-align:center;

    background:rgba(0,0,0,.25);
    border:1px solid rgba(255,255,255,.1);

    border-radius:12px;
}

.stat-box h3{
    font-size:1.5rem;
    color:#00f2fe;
    margin-top:5px;
}

.stat-box p{
    color:#cbd5e1;
    font-size:.75rem;
}

/* PRODUCT LIST */

.product-list-admin{
    display:flex;
    flex-direction:column;
    gap:10px;

    max-height:400px;
    overflow-y:auto;
}

.product-item-admin{
    display:flex;
    align-items:center;
    gap:12px;

    padding:10px;

    background:rgba(0,0,0,.25);
    border:1px solid rgba(255,255,255,.08);

    border-radius:12px;
}

.product-item-admin img{
    width:55px;
    height:55px;
    object-fit:cover;
    border-radius:8px;
}

.product-item-admin .info{
    flex:1;
    min-width:0;
}

.product-item-admin h4{
    font-size:.85rem;
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
}

.product-item-admin p{
    color:#38bdf8;
    font-size:.8rem;
    font-weight:bold;
    margin-top:4px;
}

.action-btns{
    display:flex;
    gap:5px;
}

.btn-edit,
.btn-delete{
    border:none;
    padding:7px 9px;
    border-radius:7px;
    color:white;
    font-weight:bold;
    cursor:pointer;
    font-size:.7rem;
}

.btn-edit{
    background:#f59e0b;
}

.btn-delete{
    background:#ef4444;
}

/* TABLE */

.order-table-wrapper{
    width:100%;
    overflow-x:auto;
}

.order-table{
    width:100%;
    min-width:900px;
    border-collapse:collapse;
}

.order-table th,
.order-table td{
    padding:11px 9px;
    border-bottom:1px solid rgba(255,255,255,.1);
    text-align:left;
    font-size:.78rem;
}

.order-table th{
    color:#00f2fe;
    background:rgba(0,0,0,.25);
}

.order-table td{
    color:#e2e8f0;
}

.status-select{
    padding:7px;
    border-radius:7px;

    background:#0f172a;
    color:#38bdf8;

    border:1px solid #0072ff;
}

/* PAYMENT BADGE */

.payment{
    padding:5px 8px;
    border-radius:10px;
    font-size:.7rem;
    font-weight:bold;
    background:rgba(0,198,255,.15);
    color:#67e8f9;
}

/* RESPONSIVE */

@media(max-width:800px){

    body{
        padding:10px;
    }

    header{
        padding:14px;
    }

    header h1{
        font-size:1rem;
    }

    .container{
        grid-template-columns:1fr;
    }

    .card-full{
        grid-column:auto;
    }

    .stats-grid{
        grid-template-columns:1fr 1fr;
    }
}

@media(max-width:500px){

    header{
        flex-direction:column;
        gap:12px;
        align-items:stretch;
    }

    header h1{
        text-align:center;
    }

    .btn-logout{
        width:100%;
    }

    .card{
        padding:15px;
    }

    .stats-grid{
        grid-template-columns:1fr;
    }

    .product-item-admin{
        flex-wrap:wrap;
    }

    .action-btns{
        width:100%;
    }

    .btn-edit,
    .btn-delete{
        flex:1;
    }
}
</style>
</head>

<body>

<div class="orb orb1"></div>
<div class="orb orb2"></div>

<header>
    <h1>⚡ GadgetStore Pro <span class="admin-badge">ADMIN</span></h1>

    <button class="btn-logout"
        onclick="window.location.href='index.html'">
        Keluar
    </button>
</header>


<div class="container">

<!-- ================= TAMBAH PRODUK ================= -->

<div class="card">

<h2 id="formTitle">➕ Tambah Produk Baru</h2>

<form id="productForm" onsubmit="handleFormSubmit(event)">

<input type="hidden" id="editProductId">

<div class="form-group">
<label>Nama Produk</label>
<input
type="text"
id="nama"
placeholder="Contoh: Smartphone Galaxy"
required>
</div>

<div class="form-group">
<label>Harga Produk</label>
<input
type="number"
id="harga"
placeholder="15000000"
required>
</div>

<div class="form-group">
<label>Deskripsi Produk</label>
<textarea
id="deskripsi"
rows="3"
placeholder="Masukkan spesifikasi produk..."
required></textarea>
</div>

<div class="form-group">

<label>🖼️ Gambar Produk</label>

<div class="upload-box">

<input
type="text"
id="gambarUrl"
placeholder="Masukkan URL gambar">

<input
type="file"
id="gambarFile"
accept="image/*"
onchange="convertFileToBase64('gambarFile','gambarUrl')">

</div>

</div>


<div class="form-group">

<label>🎥 Video Demo</label>

<div class="upload-box">

<input
type="text"
id="ytVideoUrl"
placeholder="https://youtu.be/...">

<input
type="file"
id="ytVideoFile"
accept="video/*"
onchange="convertFileToBase64('ytVideoFile','ytVideoUrl')">

</div>

</div>


<button
type="submit"
class="btn-submit"
id="btnSubmit">

💾 Simpan Produk

</button>

<button
type="button"
class="btn-cancel"
id="btnCancel"
onclick="resetForm">

Batal Edit

</button>

</form>

</div>


<!-- ================= DASHBOARD ================= -->

<div class="card">

<h2>📊 Dashboard Admin</h2>

<div class="stats-grid">

<div class="stat-box">
<p>Total Produk</p>
<h3 id="totalProductsCount">0</h3>
</div>

<div class="stat-box">
<p>Total Pesanan</p>
<h3 id="totalOrdersCount">0</h3>
</div>

<div class="stat-box">
<p>Total Pendapatan</p>
<h3 id="totalIncome">Rp 0</h3>
</div>

</div>


<h2>📦 Produk Aktif</h2>

<div
class="product-list-admin"
id="productListAdmin">
</div>

</div>


<!-- ================= PESANAN ================= -->

<div class="card card-full">

<h2>🚚 Kelola Pesanan Customer</h2>

<div class="order-table-wrapper">

<table class="order-table">

<thead>

<tr>

<th>ID</th>

<th>Pembeli</th>

<th>Penerima</th>

<th>Lokasi</th>

<th>Tanggal</th>

<th>Barang</th>

<th>Total</th>

<th>Pembayaran</th>

<th>Status</th>

</tr>

</thead>

<tbody id="adminOrdersBody">

</tbody>

</table>

</div>

</div>

</div>


<script>

/* ================= FILE → BASE64 ================= */

function convertFileToBase64(fileInputId,targetInputId){

const fileInput=document.getElementById(fileInputId);
const target=document.getElementById(targetInputId);

if(fileInput.files && fileInput.files[0]){

const reader=new FileReader();

reader.onload=function(e){

target.value=e.target.result;

};

reader.readAsDataURL(fileInput.files[0]);

}

}


/* ================= YOUTUBE ================= */

function formatYouTubeEmbedUrl(url){

if(!url) return '';

if(url.startsWith('data:video/'))
return url;

let videoId='';

if(url.includes('youtu.be/')){

videoId=url.split('youtu.be/')[1].split('?')[0];

}

else if(url.includes('watch?v=')){

videoId=url.split('watch?v=')[1].split('&')[0];

}

else if(url.includes('/embed/')){

videoId=url.split('/embed/')[1].split('?')[0];

}

else if(url.includes('/shorts/')){

videoId=url.split('/shorts/')[1].split('?')[0];

}

if(videoId){

return `https://www.youtube.com/embed/${videoId}`;

}

return url;

}


/* ================= DATA PRODUK ================= */

let products =
JSON.parse(localStorage.getItem('gadgetProducts')) || [

{
id:1,
nama:"Smartphone Galaxy Z",
harga:12000000,
deskripsi:"Smartphone premium dengan kamera jernih dan performa tinggi.",
gambar:"https://images.unsplash.com/photo-1511707171634-5f897ff02aa9?w=500",
ytVideo:"https://www.youtube.com/embed/Ef-2gRQdJes"
},

{
id:2,
nama:"Laptop AeroBook",
harga:18500000,
deskripsi:"Laptop tipis untuk sekolah, kerja dan multimedia.",
gambar:"https://images.unsplash.com/photo-1517336714731-489689fd1ca8?w=500",
ytVideo:"https://www.youtube.com/embed/2i-GuhsKIp4"
},

{
id:3,
nama:"Tablet Vision Pro",
harga:9500000,
deskripsi:"Tablet layar luas untuk belajar dan hiburan.",
gambar:"https://images.unsplash.com/photo-1544244015-0df4b3ffc6b0?w=500",
ytVideo:"https://www.youtube.com/embed/ogXoHel6va4"
}

];


/* ================= DATA ORDER ================= */

let orders =
JSON.parse(localStorage.getItem('gadgetOrders')) || [];


/* ================= RENDER PRODUK ================= */

function renderAdminProducts(){

const container=
document.getElementById('productListAdmin');

container.innerHTML='';

document.getElementById(
'totalProductsCount'
).innerText=products.length;


products.forEach((p,index)=>{

const item=document.createElement('div');

item.className='product-item-admin';

item.innerHTML=`

<img
src="${p.gambar}"
onerror="this.src='https://via.placeholder.com/100'"
>

<div class="info">

<h4>${p.nama}</h4>

<p>
Rp ${Number(p.harga).toLocaleString('id-ID')}
</p>

</div>

<div class="action-btns">

<button
class="btn-edit"
onclick="editProduct(${p.id})">

✏️ Edit

</button>

<button
class="btn-delete"
onclick="deleteProduct(${index})">

🗑️ Hapus

</button>

</div>

`;

container.appendChild(item);

});

localStorage.setItem(
'gadgetProducts',
JSON.stringify(products)
);

}


/* ================= RENDER ORDER ================= */

function renderAdminOrders(){

const tbody=
document.getElementById('adminOrdersBody');

tbody.innerHTML='';

document.getElementById(
'totalOrdersCount'
).innerText=orders.length;


let income=0;

orders.forEach(ord=>{

income+=Number(ord.total)||0;

});


document.getElementById(
'totalIncome'
).innerText=
'Rp '+income.toLocaleString('id-ID');


if(orders.length===0){

tbody.innerHTML=`

<tr>

<td colspan="9"
style="text-align:center;color:#94a3b8">

Belum ada pesanan masuk.

</td>

</tr>

`;

return;

}


orders.forEach((ord,index)=>{

const itemsSummary=

ord.items
.map(i=>`${i.nama} (${i.qty}x)`)
.join(', ');


const buyer=
ord.buyerName || '-';

const receiver=
ord.receiverName || '-';

const location=
ord.location || '-';

const payment=
ord.paymentMethod || '-';


const tr=document.createElement('tr');


tr.innerHTML=`

<td>

<strong>#${ord.id}</strong>

</td>


<td>

👤 ${buyer}

</td>


<td>

📦 ${receiver}

</td>


<td>

📍 ${location}

</td>


<td>

${ord.date || '-'}

</td>


<td>

${itemsSummary}

</td>


<td style="color:#22d3ee;font-weight:bold">

Rp ${Number(ord.total).toLocaleString('id-ID')}

</td>


<td>

<span class="payment">

💳 ${payment}

</span>

</td>


<td>

<select
class="status-select"
onchange="updateOrderStatus(${index},this.value)"
>

<option
value="Sedang Diproses"
${ord.status==='Sedang Diproses'?'selected':''}>

⏳ Diproses

</option>

<option
value="Dalam Perjalanan"
${ord.status==='Dalam Perjalanan'?'selected':''}>

🚚 Perjalanan

</option>

<option
value="Sudah Sampai"
${ord.status==='Sudah Sampai'?'selected':''}>

✅ Sampai

</option>

<option
value="Selesai"
${ord.status==='Selesai'?'selected':''}>

🎉 Selesai

</option>

</select>

</td>

`;

tbody.appendChild(tr);

});

}


/* ================= STATUS ================= */

function updateOrderStatus(index,status){

orders[index].status=status;

localStorage.setItem(
'gadgetOrders',
JSON.stringify(orders)
);

alert(
`Status pesanan #${orders[index].id} diperbarui menjadi ${status}`
);

renderAdminOrders();

}


/* ================= TAMBAH PRODUK ================= */

function handleFormSubmit(event){

event.preventDefault();


const editId=
document.getElementById('editProductId').value;


let video=
document.getElementById('ytVideoUrl').value;

video=formatYouTubeEmbedUrl(video);


const productData={

id:editId
?Number(editId)
:Date.now(),

nama:
document.getElementById('nama').value,

harga:
Number(
document.getElementById('harga').value
),

deskripsi:
document.getElementById('deskripsi').value,

gambar:
document.getElementById('gambarUrl').value
||'https://via.placeholder.com/300',

ytVideo:video

};


if(editId){

const index=
products.findIndex(
p=>p.id===Number(editId)
);

if(index!==-1){

products[index]=productData;

alert('Produk berhasil diperbarui!');

}

}

else{

products.push(productData);

alert('Produk berhasil ditambahkan!');

}


renderAdminProducts();

resetForm();

}


/* ================= EDIT ================= */

function editProduct(id){

const product=
products.find(p=>p.id===id);

if(!product)return;


document.getElementById(
'editProductId'
).value=product.id;


document.getElementById(
'nama'
).value=product.nama;


document.getElementById(
'harga'
).value=product.harga;


document.getElementById(
'deskripsi'
).value=product.deskripsi;


document.getElementById(
'gambarUrl'
).value=product.gambar;


document.getElementById(
'ytVideoUrl'
).value=product.ytVideo;


document.getElementById(
'formTitle'
).innerText=
'✏️ Edit Produk';


document.getElementById(
'btnSubmit'
).innerText=
'💾 Update Produk';


document.getElementById(
'btnCancel'
).style.display='block';


window.scrollTo({
top:0,
behavior:'smooth'
});

}


/* ================= RESET ================= */

function resetForm(){

document.getElementById(
'productForm'
).reset();

document.getElementById(
'editProductId'
).value='';

document.getElementById(
'formTitle'
).innerText=
'➕ Tambah Produk Baru';

document.getElementById(
'btnSubmit'
).innerText=
'💾 Simpan Produk';

document.getElementById(
'btnCancel'
).style.display='none';

}


/* ================= HAPUS ================= */

function deleteProduct(index){

if(confirm(
'Yakin ingin menghapus produk ini?'
)){

products.splice(index,1);

renderAdminProducts();

}

}


/* ================= START ================= */

renderAdminProducts();

renderAdminOrders();

</script>

</body>
</html>
