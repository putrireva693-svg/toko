<!DOCTYPE html>
<html lang="id">

<head>

<meta charset="UTF-8">

<meta
name="viewport"
content="width=device-width, initial-scale=1.0">

<title>GadgetStore Pro - Admin</title>

<link
href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;600;700&family=Poppins:wght@400;500;600&display=swap"
rel="stylesheet">

<style>

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {

    min-height: 100vh;

    font-family:
        'Poppins',
        sans-serif;

    color: #e2e8f0;

    background:

        radial-gradient(
            circle at 10% 10%,
            #00e5ff22,
            transparent 25%
        ),

        radial-gradient(
            circle at 90% 90%,
            #0066ff22,
            transparent 30%
        ),

        linear-gradient(
            135deg,
            #020617,
            #071a2d,
            #082f49,
            #020617
        );
}


/* NAVBAR */

header {

    position: sticky;

    top: 0;

    z-index: 10;

    padding:
        16px 5%;

    display: flex;

    justify-content:
        space-between;

    align-items: center;

    background:
        rgba(2,15,30,.9);

    backdrop-filter:
        blur(18px);

    border-bottom:
        1px solid
        rgba(0,229,255,.15);
}

header h1 {

    font-family:
        'Orbitron',
        sans-serif;

    color: #00e5ff;

    font-size: 20px;
}

.logout {

    padding:
        9px 14px;

    border: none;

    border-radius: 9px;

    color: white;

    background:
        #ef4444;

    cursor: pointer;
}


/* CONTAINER */

.container {

    width: 92%;

    max-width: 1400px;

    margin:
        35px auto;
}

.title {

    font-family:
        'Orbitron',
        sans-serif;

    color: white;

    margin-bottom: 25px;
}


/* STAT */

.stats {

    display: grid;

    grid-template-columns:
        repeat(
            auto-fit,
            minmax(200px,1fr)
        );

    gap: 18px;

    margin-bottom: 30px;
}

.stat {

    padding: 22px;

    border-radius: 17px;

    background:
        rgba(8,30,50,.75);

    border:
        1px solid
        rgba(0,229,255,.13);
}

.stat h3 {

    font-size: 13px;

    color: #94a3b8;
}

.stat strong {

    display: block;

    margin-top: 8px;

    color: #00e5ff;

    font-family:
        'Orbitron',
        sans-serif;

    font-size: 25px;
}


/* TABLE */

.table-box {

    overflow-x: auto;

    border-radius: 17px;

    background:
        rgba(8,30,50,.75);

    border:
        1px solid
        rgba(0,229,255,.13);
}

table {

    width: 100%;

    border-collapse:
        collapse;

    min-width: 1100px;
}

th {

    padding: 15px;

    text-align: left;

    background:
        rgba(0,229,255,.08);

    color: #00e5ff;

    font-family:
        'Orbitron',
        sans-serif;

    font-size: 11px;
}

td {

    padding: 14px;

    border-top:
        1px solid
        rgba(255,255,255,.06);

    font-size: 13px;
}

tr:hover {

    background:
        rgba(0,229,255,.04);
}


/* STATUS */

.status-select {

    padding: 7px;

    border-radius: 7px;

    border:
        1px solid
        #164e63;

    background:
        #020f1c;

    color: white;

    outline: none;
}


/* EMPTY */

.empty {

    text-align: center;

    padding: 40px;

    color: #64748b;
}


@media(max-width:600px) {

    header h1 {
        font-size: 14px;
    }

}

</style>

</head>


<body>


<header>

    <h1>
        ⚙️ GADGETSTORE PRO ADMIN
    </h1>

    <button
        class="logout"
        onclick="location.href='index.html'">

        Keluar

    </button>

</header>


<div class="container">

    <h2 class="title">
        Dashboard Administrator
    </h2>


    <div class="stats">

        <div class="stat">

            <h3>
                TOTAL PRODUK
            </h3>

            <strong id="totalProducts">
                0
            </strong>

        </div>


        <div class="stat">

            <h3>
                TOTAL PESANAN
            </h3>

            <strong id="totalOrders">
                0
            </strong>

        </div>


        <div class="stat">

            <h3>
                TOTAL PENDAPATAN
            </h3>

            <strong id="totalIncome">
                Rp0
            </strong>

        </div>

    </div>


    <div class="table-box">

        <table>

            <thead>

                <tr>

                    <th>
                        ID PESANAN
                    </th>

                    <th>
                        TANGGAL
                    </th>

                    <th>
                        PEMBELI
                    </th>

                    <th>
                        PENERIMA
                    </th>

                    <th>
                        LOKASI
                    </th>

                    <th>
                        METODE PEMBAYARAN
                    </th>

                    <th>
                        TOTAL
                    </th>

                    <th>
                        STATUS
                    </th>

                </tr>

            </thead>


            <tbody
                id="orderTable">

            </tbody>

        </table>

    </div>

</div>


<script>

function rupiah(number) {

    return Number(number)
        .toLocaleString(
            "id-ID",
            {
                style: "currency",
                currency: "IDR",
                maximumFractionDigits: 0
            }
        );

}


function loadOrders() {

    const orders =
        JSON.parse(
            localStorage.getItem(
                "gadgetOrders"
            )
        ) || [];


    document.getElementById(
        "totalProducts"
    ).innerText = "6";


    document.getElementById(
        "totalOrders"
    ).innerText =
        orders.length;


    let income = 0;


    orders.forEach(
        function(order) {

            income +=
                Number(
                    order.total
                );

        }
    );


    document.getElementById(
        "totalIncome"
    ).innerText =
        rupiah(income);


    const table =
        document.getElementById(
            "orderTable"
        );


    table.innerHTML = "";


    if (orders.length === 0) {

        table.innerHTML = `

            <tr>

                <td
                    colspan="8"
                    class="empty">

                    Belum ada pesanan
                    dari pembeli.

                </td>

            </tr>

        `;

        return;

    }


    orders.forEach(
        function(order,index) {

            const tr =
                document.createElement(
                    "tr"
                );


            tr.innerHTML = `

                <td>
                    <strong>
                        ${order.id}
                    </strong>
                </td>


                <td>
                    ${order.date}
                </td>


                <td>
                    👤
                    ${order.buyerName}
                </td>


                <td>
                    📦
                    ${order.penerima}
                    <br>
                    <small>
                        ${order.telepon}
                    </small>
                </td>


                <td>
                    📍
                    ${order.lokasi}
                    <br>
                    <small>
                        ${order.alamat}
                    </small>
                </td>


                <td>
                    💳
                    <strong>
                        ${order.payment}
                    </strong>
                </td>


                <td>
                    <strong
                    style="color:#00e5ff">

                        ${rupiah(
                            order.total
                        )}

                    </strong>
                </td>


                <td>

                    <select
                        class="status-select"
                        onchange="
                        updateStatus(
                            ${index},
                            this.value
                        )">

                        <option
                            ${
                            order.status ===
                            "Sedang Diproses"
                            ? "selected"
                            : ""
                            }>

                            Sedang Diproses

                        </option>


                        <option
                            ${
                            order.status ===
                            "Dalam Perjalanan"
                            ? "selected"
                            : ""
                            }>

                            Dalam Perjalanan

                        </option>


                        <option
                            ${
                            order.status ===
                            "Sudah Sampai"
                            ? "selected"
                            : ""
                            }>

                            Sudah Sampai

                        </option>


                        <option
                            ${
                            order.status ===
                            "Selesai"
                            ? "selected"
                            : ""
                            }>

                            Selesai

                        </option>

                    </select>

                </td>

            `;


            table.appendChild(tr);

        }
    );

}


function updateStatus(index,status) {

    const orders =
        JSON.parse(
            localStorage.getItem(
                "gadgetOrders"
            )
        ) || [];


    if (!orders[index]) return;


    orders[index].status =
        status;


    localStorage.setItem(
        "gadgetOrders",
        JSON.stringify(orders)
    );


    alert(
        "✅ Status pesanan berhasil diperbarui!"
    );

}


loadOrders();

</script>

</body>
</html>
